<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="node-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="direct-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="indirect-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-gradient)"/>

  <!-- Grid Pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000" stroke-width="1"/>
    </pattern>
    <rect width="800" height="600" fill="url(#grid)"/>
  </g>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#1e293b">
    路径分析完整教程
  </text>
  <text x="400" y="100" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#64748b">
    Path Analysis: 从直观理解到高级应用
  </text>

  <!-- Path Diagram - Main Illustration -->
  <g transform="translate(0, 30)">
    <!-- Nodes -->
    <!-- X (Exogenous) -->
    <g filter="url(#shadow)">
      <rect x="80" y="200" width="100" height="70" rx="10" fill="url(#node-gradient)" stroke="#1e40af" stroke-width="2"/>
      <text x="130" y="235" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="white">自变量 X</text>
      <text x="130" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dbeafe">Exogenous</text>
    </g>

    <!-- M1 (Mediator 1) -->
    <g filter="url(#shadow)">
      <rect x="280" y="150" width="100" height="70" rx="10" fill="url(#node-gradient)" stroke="#1e40af" stroke-width="2"/>
      <text x="330" y="185" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="white">中介 M1</text>
      <text x="330" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dbeafe">Mediator</text>
    </g>

    <!-- M2 (Mediator 2) -->
    <g filter="url(#shadow)">
      <rect x="280" y="280" width="100" height="70" rx="10" fill="url(#node-gradient)" stroke="#1e40af" stroke-width="2"/>
      <text x="330" y="315" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="white">中介 M2</text>
      <text x="330" y="335" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dbeafe">Mediator</text>
    </g>

    <!-- Y (Endogenous) -->
    <g filter="url(#shadow)">
      <rect x="520" y="215" width="100" height="70" rx="10" fill="url(#node-gradient)" stroke="#1e40af" stroke-width="2"/>
      <text x="570" y="250" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="white">因变量 Y</text>
      <text x="570" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dbeafe">Endogenous</text>
    </g>

    <!-- Direct Effect Path -->
    <g>
      <path d="M 180 235 C 250 235, 350 250, 520 250" fill="none" stroke="url(#direct-gradient)" stroke-width="3" stroke-dasharray="5,5"/>
      <polygon points="515,245 525,250 515,255" fill="#059669"/>
      <rect x="310" y="225" width="90" height="26" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <text x="355" y="243" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">直接效应 c'</text>
    </g>

    <!-- Indirect Paths -->
    <!-- X -> M1 -->
    <path d="M 180 220 C 230 200, 250 185, 280 185" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="275,182 285,185 278,190" fill="#d97706"/>
    <text x="230" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">a</text>

    <!-- X -> M2 -->
    <path d="M 180 250 C 230 280, 250 315, 280 315" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="275,318 285,315 278,310" fill="#d97706"/>
    <text x="230" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">a'</text>

    <!-- M1 -> Y -->
    <path d="M 380 185 C 440 200, 480 225, 520 235" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="515,235 520,242 512,240" fill="#d97706"/>
    <text x="450" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">b</text>

    <!-- M2 -> Y -->
    <path d="M 380 315 C 440 310, 480 275, 520 265" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="515,270 520,262 512,268" fill="#d97706"/>
    <text x="450" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">b'</text>

    <!-- M1 -> M2 -->
    <path d="M 330 220 L 330 280" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <polygon points="327,275 330,280 333,275" fill="#7c3aed"/>
    <text x="345" y="255" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">d</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 440)">
    <rect width="640" height="120" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1" opacity="0.9"/>

    <text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">
      效应分解说明
    </text>

    <!-- Direct Effect -->
    <line x1="40" y1="55" x2="100" y2="55" stroke="url(#direct-gradient)" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="115" y="60" font-family="sans-serif" font-size="13" fill="#334155">
      <tspan font-weight="bold">直接效应</tspan> = c'
    </text>

    <!-- Indirect Effect -->
    <line x1="260" y1="55" x2="320" y2="55" stroke="#f59e0b" stroke-width="3"/>
    <text x="335" y="60" font-family="sans-serif" font-size="13" fill="#334155">
      <tspan font-weight="bold">间接效应</tspan> = a × b
    </text>

    <!-- Total Effect -->
    <line x1="490" y1="55" x2="550" y2="55" stroke="#6366f1" stroke-width="3"/>
    <text x="565" y="60" font-family="sans-serif" font-size="13" fill="#334155">
      <tspan font-weight="bold">总效应</tspan> = c' + a×b
    </text>

    <!-- Formula Box -->
    <rect x="180" y="75" width="280" height="35" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="320" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">
      路径分析量化因果链条的强度
    </text>
  </g>

  <!-- Footer -->
  <text x="400" y="585" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">
    R 语言统计分析教程 · lavaan | piecewiseSEM | plspm
  </text>
</svg>
