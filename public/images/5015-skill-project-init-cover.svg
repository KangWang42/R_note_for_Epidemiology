<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/><stop offset="100%" style="stop-color:#1b4332"/>
    </linearGradient>
    <linearGradient id="fold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#52b788"/><stop offset="100%" style="stop-color:#2d6a4f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <text x="20" y="40" fill="#52b788" font-family="monospace" font-size="13" opacity="0.5">$ init_project()</text>
  <!-- folder tree -->
  <g font-family="monospace" font-size="11" fill="#d8f3dc">
    <rect x="40" y="58" width="150" height="20" rx="3" fill="url(#fold)" opacity="0.9"/>
    <text x="50" y="72" fill="#0d1b2a" font-weight="bold">project/</text>
    <text x="64" y="96">├ 01_data/rawdata</text>
    <text x="64" y="114">├ 02_code/</text>
    <text x="64" y="132">├ 03_tables/</text>
    <text x="64" y="150">├ 04_figures/</text>
    <text x="64" y="168">├ 07_paper/</text>
    <text x="64" y="186">└ 09_backup/</text>
  </g>
  <!-- lock on rawdata -->
  <text x="220" y="96" fill="#f9c74f" font-family="monospace" font-size="11">🔒 只读</text>
  <g font-family="monospace" font-size="10" fill="#95d5b2">
    <text x="220" y="116">CLAUDE.md</text>
    <text x="220" y="132">DECISIONS.md</text>
    <text x="220" y="148">BACKLOG.md</text>
    <text x="220" y="164">SESSION_LOG.md</text>
  </g>
  <text x="200" y="222" fill="#f8f9fa" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">project-init</text>
  <text x="200" y="240" fill="#52b788" font-family="Arial" font-size="10" text-anchor="middle">一键搭建标准化研究项目骨架</text>
</svg>
