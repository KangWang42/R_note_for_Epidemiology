<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#1e293b">
    路径分析效应类型分解
  </text>
  <text x="700" y="85" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#64748b">
    直接效应、间接效应与总效应的关系示意图
  </text>

  <!-- Main Path Diagram -->
  <g transform="translate(150, 120)">
    <!-- Title for this section -->
    <text x="500" y="0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#334155">
      基础中介模型
    </text>

    <!-- X Node -->
    <g filter="url(#shadow)">
      <rect x="0" y="100" width="120" height="80" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="60" y="135" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e40af">自变量</text>
      <text x="60" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3b82f6">X</text>
    </g>

    <!-- M Node -->
    <g filter="url(#shadow)">
      <rect x="440" y="100" width="120" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="500" y="135" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#92400e">中介变量</text>
      <text x="500" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#d97706">M</text>
    </g>

    <!-- Y Node -->
    <g filter="url(#shadow)">
      <rect x="880" y="100" width="120" height="80" rx="12" fill="#dcfce7" stroke="#10b981" stroke-width="2.5"/>
      <text x="940" y="135" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#065f46">因变量</text>
      <text x="940" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#059669">Y</text>
    </g>

    <!-- Path a (X -> M) -->
    <path d="M 120 140 L 440 140" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <text x="280" y="125" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c2410c">
      a 路径
    </text>
    <text x="280" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#78716c">
      自变量 → 中介
    </text>

    <!-- Path b (M -> Y) -->
    <path d="M 560 140 L 880 140" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <text x="720" y="125" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c2410c">
      b 路径
    </text>
    <text x="720" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#78716c">
      中介 → 因变量
    </text>

    <!-- Path c' (X -> Y, direct) -->
    <path d="M 60 180 C 60 280, 940 280, 940 180" stroke="#2563eb" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrow-blue)" fill="none"/>
    <text x="500" y="260" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4ed8">
      c' 路径 (直接效应)
    </text>
    <text x="500" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#78716c">
      X 对 Y 的直接影响，不经过 M
    </text>
  </g>

  <!-- Effect Types Panel -->
  <g transform="translate(100, 460)">
    <!-- Direct Effect Card -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="380" height="180" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
      <rect x="0" y="0" width="380" height="45" rx="12" fill="#2563eb"/>
      <text x="190" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">
        直接效应 (Direct Effect)
      </text>

      <text x="20" y="75" font-family="sans-serif" font-size="16" fill="#334155">
        <tspan font-weight="bold">符号：</tspan>c'
      </text>
      <text x="20" y="105" font-family="sans-serif" font-size="16" fill="#334155">
        <tspan font-weight="bold">公式：</tspan>c' = X → Y 路径系数
      </text>
      <text x="20" y="135" font-family="sans-serif" font-size="15" fill="#475569">
        X 对 Y 的直接影响，不经过中介变量 M
      </text>
      <text x="20" y="165" font-family="sans-serif" font-size="14" fill="#64748b">
        例如：运动直接改善血糖（独立于体重）
      </text>
    </g>

    <!-- Indirect Effect Card -->
    <g filter="url(#shadow)">
      <rect x="410" y="0" width="380" height="180" rx="12" fill="white" stroke="#ea580c" stroke-width="2"/>
      <rect x="410" y="0" width="380" height="45" rx="12" fill="#ea580c"/>
      <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">
        间接效应 (Indirect Effect)
      </text>

      <text x="430" y="75" font-family="sans-serif" font-size="16" fill="#334155">
        <tspan font-weight="bold">符号：</tspan>a × b
      </text>
      <text x="430" y="105" font-family="sans-serif" font-size="16" fill="#334155">
        <tspan font-weight="bold">公式：</tspan>间接效应 = a × b
      </text>
      <text x="430" y="135" font-family="sans-serif" font-size="15" fill="#475569">
        X 通过 M 对 Y 的间接影响
      </text>
      <text x="430" y="165" font-family="sans-serif" font-size="14" fill="#64748b">
        例如：运动通过降低体重来改善血糖
      </text>
    </g>

    <!-- Total Effect Card -->
    <g filter="url(#shadow)">
      <rect x="820" y="0" width="380" height="180" rx="12" fill="white" stroke="#7c3aed" stroke-width="2"/>
      <rect x="820" y="0" width="380" height="45" rx="12" fill="#7c3aed"/>
      <text x="1010" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">
        总效应 (Total Effect)
      </text>

      <text x="840" y="75" font-family="sans-serif" font-size="16" fill="#334155">
        <tspan font-weight="bold">符号：</tspan>c
      </text>
      <text x="840" y="105" font-family="sans-serif" font-size="16" fill="#334155">
        <tspan font-weight="bold">公式：</tspan>c = c' + a×b
      </text>
      <text x="840" y="135" font-family="sans-serif" font-size="15" fill="#475569">
        X 对 Y 的总体影响
      </text>
      <text x="840" y="165" font-family="sans-serif" font-size="14" fill="#64748b">
        总效应 = 直接效应 + 间接效应
      </text>
    </g>
  </g>

  <!-- Complex Example: Multiple Mediators -->
  <g transform="translate(150, 690)">
    <text x="500" y="0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#334155">
      复杂模型：多重中介
    </text>

    <!-- Small nodes -->
    <g>
      <rect x="50" y="30" width="80" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <text x="90" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">X</text>

      <rect x="300" y="10" width="80" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="340" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">M1</text>

      <rect x="300" y="70" width="80" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="340" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">M2</text>

      <rect x="550" y="30" width="80" height="50" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
      <text x="590" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#065f46">Y</text>

      <!-- Paths -->
      <path d="M 130 40 L 300 35" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
      <path d="M 130 60 L 300 95" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
      <path d="M 380 35 L 550 45" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
      <path d="M 380 95 L 550 65" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
      <path d="M 340 60 L 340 70" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <path d="M 90 80 C 90 130, 590 130, 590 80" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-blue)" fill="none"/>
    </g>

    <!-- Effect formulas -->
    <g transform="translate(700, 20)">
      <text x="0" y="0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">
        间接效应计算：
      </text>
      <text x="0" y="25" font-family="sans-serif" font-size="12" fill="#475569">
        • X → M1 → Y: a₁ × b₁
      </text>
      <text x="0" y="50" font-family="sans-serif" font-size="12" fill="#475569">
        • X → M2 → Y: a₂ × b₂
      </text>
      <text x="0" y="75" font-family="sans-serif" font-size="12" fill="#475569">
        • X → M1 → M2 → Y: a₁ × d × b₂
      </text>
      <text x="0" y="105" font-family="sans-serif" font-size="12" fill="#475569">
        <tspan font-weight="bold">总间接效应</tspan> = a₁b₁ + a₂b₂ + a₁db₂
      </text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="700" y="870" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">
    注：间接效应的显著性需通过 Bootstrap 或 Delta 方法检验
  </text>
</svg>
