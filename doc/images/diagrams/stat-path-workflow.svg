<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="step-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="step-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="step-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="step-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#fafafa"/>

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1e293b">
    路径分析完整工作流程
  </text>
  <text x="700" y="75" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#64748b">
    从理论构建到结果报告的七步分析流程
  </text>

  <!-- Step 1: Theory -->
  <g transform="translate(80, 110)" filter="url(#shadow)">
    <rect width="170" height="100" rx="10" fill="url(#step-blue)"/>
    <text x="85" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">步骤 1</text>
    <text x="85" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dbeafe">理论框架</text>
    <text x="85" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e0e7ff">明确因果假设</text>
  </g>

  <!-- Step 2: Path Diagram -->
  <g transform="translate(290, 110)" filter="url(#shadow)">
    <rect width="170" height="100" rx="10" fill="url(#step-blue)"/>
    <text x="85" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">步骤 2</text>
    <text x="85" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dbeafe">绘制路径图</text>
    <text x="85" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e0e7ff">可视化变量关系</text>
  </g>

  <!-- Step 3: Model ID -->
  <g transform="translate(500, 110)" filter="url(#shadow)">
    <rect width="170" height="100" rx="10" fill="url(#step-blue)"/>
    <text x="85" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">步骤 3</text>
    <text x="85" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dbeafe">模型识别</text>
    <text x="85" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e0e7ff">确保可估计</text>
  </g>

  <!-- Step 4: Model Fitting -->
  <g transform="translate(710, 110)" filter="url(#shadow)">
    <rect width="170" height="100" rx="10" fill="url(#step-green)"/>
    <text x="85" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">步骤 4</text>
    <text x="85" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#d1fae5">模型拟合</text>
    <text x="85" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ecfdf5">估计路径系数</text>
  </g>

  <!-- Step 5: Model Eval -->
  <g transform="translate(920, 110)" filter="url(#shadow)">
    <rect width="170" height="100" rx="10" fill="url(#step-green)"/>
    <text x="85" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">步骤 5</text>
    <text x="85" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#d1fae5">模型评估</text>
    <text x="85" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ecfdf5">检查拟合优度</text>
  </g>

  <!-- Step 6: Effect Decomp -->
  <g transform="translate(1130, 110)" filter="url(#shadow)">
    <rect width="170" height="100" rx="10" fill="url(#step-purple)"/>
    <text x="85" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">步骤 6</text>
    <text x="85" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ede9fe">效应分解</text>
    <text x="85" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f5f3ff">直接/间接/总</text>
  </g>

  <!-- Connecting arrows -->
  <path d="M 250 160 L 290 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 460 160 L 500 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 670 160 L 710 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 880 160 L 920 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1090 160 L 1130 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7: Reporting -->
  <g transform="translate(560, 250)" filter="url(#shadow)">
    <rect width="280" height="100" rx="10" fill="url(#step-orange)"/>
    <text x="140" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">步骤 7</text>
    <text x="140" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fef3c7">结果解释与报告</text>
    <text x="140" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fffbeb">统计与实际意义</text>
  </g>

  <!-- Arrow from step 6 to 7 -->
  <path d="M 1215 210 L 700 250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Detail Panels -->
  <!-- Panel 1: Theory -->
  <g transform="translate(80, 250)">
    <rect width="350" height="200" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="350" height="35" rx="10" fill="#eff6ff"/>
    <text x="175" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">理论框架构建</text>

    <text x="20" y="60" font-family="sans-serif" font-size="13" fill="#334155">
      ✓ 基于文献或理论提出假设
    </text>
    <text x="20" y="85" font-family="sans-serif" font-size="13" fill="#334155">
      ✓ 明确变量间的因果顺序
    </text>
    <text x="20" y="110" font-family="sans-serif" font-size="13" fill="#334155">
      ✓ 识别可能的混杂因素
    </text>
    <text x="20" y="135" font-family="sans-serif" font-size="13" fill="#334155">
      ✓ 考虑中介和调节变量
    </text>
    <text x="20" y="165" font-family="sans-serif" font-size="12" fill="#64748b" font-style="italic">
      示例：健康素养 → 自我管理 → 生活质量
    </text>
    <text x="20" y="185" font-family="sans-serif" font-size="12" fill="#64748b" font-style="italic">
      控制年龄、性别、病程等混杂
    </text>
  </g>

  <!-- Panel 2: Model ID -->
  <g transform="translate(460, 250)">
    <rect width="350" height="200" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="350" height="35" rx="10" fill="#eff6ff"/>
    <text x="175" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">模型识别检查</text>

    <text x="20" y="60" font-family="sans-serif" font-size="13" fill="#334155">
      ✓ 计算自由度 (df > 0)
    </text>
    <text x="20" y="85" font-family="sans-serif" font-size="13" fill="#334155">
      ✓ 数据点数 ≥ 参数个数
    </text>
    <text x="20" y="110" font-family="sans-serif" font-size="13" fill="#334155">
      ✓ 每个潜变量 ≥ 3 个指标
    </text>
    <text x="20" y="135" font-family="sans-serif" font-size="13" fill="#334155">
      ✓ 避免经验识别不足
    </text>
    <text x="20" y="165" font-family="sans-serif" font-size="12" fill="#64748b">
      公式：df = p(p+1)/2 - t
    </text>
    <text x="20" y="185" font-family="sans-serif" font-size="12" fill="#64748b">
      p=变量数, t=待估参数数
    </text>
  </g>

  <!-- Panel 3: Model Fitting -->
  <g transform="translate(840, 250)">
    <rect width="350" height="200" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="350" height="35" rx="10" fill="#f0fdf4"/>
    <text x="175" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#065f46">模型拟合方法</text>

    <text x="20" y="60" font-family="sans-serif" font-size="13" fill="#334155">
      <tspan font-weight="bold">ML:</tspan> 最大似然法 (默认)
    </text>
    <text x="20" y="85" font-family="sans-serif" font-size="13" fill="#334155">
      <tspan font-weight="bold">MLR:</tspan> 稳健最大似然 (非正态)
    </text>
    <text x="20" y="110" font-family="sans-serif" font-size="13" fill="#334155">
      <tspan font-weight="bold">Bootstrap:</tspan> 自助法 (小样本)
    </text>
    <text x="20" y="140" font-family="sans-serif" font-size="12" fill="#64748b">
      R 包选择：
    </text>
    <text x="20" y="165" font-family="sans-serif" font-size="12" fill="#64748b">
      • lavaan: 最常用，语法简洁
    </text>
    <text x="20" y="185" font-family="sans-serif" font-size="12" fill="#64748b">
      • piecewiseSEM: 分段/层次数据
    </text>
  </g>

  <!-- Panel 4: Model Evaluation -->
  <g transform="translate(80, 480)">
    <rect width="400" height="180" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="400" height="35" rx="10" fill="#f0fdf4"/>
    <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#065f46">模型拟合评估指标</text>

    <g transform="translate(20, 50)">
      <text x="0" y="0" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">χ² 卡方:</tspan> p > 0.05 (不拒绝模型)
      </text>
      <text x="0" y="22" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">RMSEA:</tspan> &lt; 0.08 (好), &lt; 0.05 (优秀)
      </text>
      <text x="0" y="44" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">SRMR:</tspan> &lt; 0.08 (好)
      </text>
      <text x="200" y="0" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">CFI:</tspan> &gt; 0.90 (可接受)
      </text>
      <text x="200" y="22" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">TLI/NNFI:</tspan> &gt; 0.90
      </text>
      <text x="200" y="44" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">R²:</tspan> 解释变异比例
      </text>
    </g>
  </g>

  <!-- Panel 5: Effect Decomposition -->
  <g transform="translate(510, 480)">
    <rect width="400" height="180" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="400" height="35" rx="10" fill="#f5f3ff"/>
    <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">效应分解</text>

    <g transform="translate(20, 50)">
      <text x="0" y="0" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">直接效应 (c'):</tspan> X → Y 的路径系数
      </text>
      <text x="0" y="22" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">间接效应:</tspan> 所有中介路径乘积之和
      </text>
      <text x="0" y="44" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">总效应:</tspan> 直接 + 间接效应
      </text>
      <text x="200" y="0" font-family="sans-serif" font-size="12" fill="#334155">
        <tspan font-weight="bold">中介类型:</tspan>
      </text>
      <text x="200" y="22" font-family="sans-serif" font-size="12" fill="#334155">
        • 完全中介: c' 不显著
      </text>
      <text x="200" y="44" font-family="sans-serif" font-size="12" fill="#334155">
        • 部分中介: c' 显著
      </text>
    </g>
  </g>

  <!-- Panel 6: Reporting -->
  <g transform="translate(940, 480)">
    <rect width="400" height="180" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="400" height="35" rx="10" fill="#fffbeb"/>
    <text x="200" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">报告内容清单</text>

    <g transform="translate(20, 50)">
      <text x="0" y="0" font-family="sans-serif" font-size="12" fill="#334155">
        ✓ 路径系数表 (标准化+非标准化)
      </text>
      <text x="0" y="22" font-family="sans-serif" font-size="12" fill="#334155">
        ✓ 效应分解表 (直接/间接/总)
      </text>
      <text x="0" y="44" font-family="sans-serif" font-size="12" fill="#334155">
        ✓ 模型拟合指标
      </text>
      <text x="0" y="66" font-family="sans-serif" font-size="12" fill="#334155">
        ✓ R² 和置信区间
      </text>
      <text x="200" y="0" font-family="sans-serif" font-size="12" fill="#334155">
        ✓ 路径图
      </text>
      <text x="200" y="22" font-family="sans-serif" font-size="12" fill="#334155">
        ✓ 统计+实际意义解读
      </text>
      <text x="200" y="44" font-family="sans-serif" font-size="12" fill="#334155">
        ✓ 与假设的符合程度
      </text>
      <text x="200" y="66" font-family="sans-serif" font-size="12" fill="#334155">
        ✓ 研究局限与建议
      </text>
    </g>
  </g>

  <!-- Footer: R Code Example -->
  <g transform="translate(80, 690)">
    <rect width="1240" height="90" rx="8" fill="#1e293b"/>
    <text x="20" y="25" font-family="monospace" font-size="13" fill="#22d3ee">
      library(lavaan)
    </text>
    <text x="20" y="45" font-family="monospace" font-size="13" fill="#a5f3fc">
      model &lt;- 'M ~ a*X;  Y ~ c*X + b*M'
    </text>
    <text x="20" y="65" font-family="monospace" font-size="13" fill="#fcd34d">
      indirect := a * b;  total := c + a*b
    </text>
    <text x="500" y="45" font-family="monospace" font-size="13" fill="#fca5a5">
      fit &lt;- sem(model, data)
    </text>
    <text x="500" y="65" font-family="monospace" font-size="13" fill="#86efac">
      summary(fit, standardized=TRUE, fit.measures=TRUE)
    </text>
  </g>
</svg>
