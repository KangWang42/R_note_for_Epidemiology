<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-gradient)"/>

  <!-- Title Area -->
  <text x="400" y="80" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#1e3a8a" text-anchor="middle">阶梯设计</text>
  <text x="400" y="130" font-family="system-ui, sans-serif" font-size="24" fill="#64748b" text-anchor="middle">Stepped Wedge Cluster Randomized Trial</text>

  <!-- Stepped Wedge Diagram -->
  <g transform="translate(150, 200)">
    <!-- Time axis label -->
    <text x="225" y="-20" font-family="system-ui, sans-serif" font-size="16" fill="#475569" text-anchor="middle">时间</text>
    <line x1="0" y1="0" x2="450" y2="0" stroke="#94a3b8" stroke-width="2"/>

    <!-- Period labels -->
    <text x="45" y="335" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">T1</text>
    <text x="135" y="335" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">T2</text>
    <text x="225" y="335" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">T3</text>
    <text x="315" y="335" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">T4</text>
    <text x="405" y="335" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">T5</text>

    <!-- Cluster labels -->
    <text x="-20" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">集群 A</text>
    <text x="-20" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">集群 B</text>
    <text x="-20" y="175" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">集群 C</text>
    <text x="-20" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">集群 D</text>

    <!-- Grid lines -->
    <line x1="90" y1="0" x2="90" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="180" y1="0" x2="180" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="270" y1="0" x2="270" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="360" y1="0" x2="360" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- Stepped Wedge Blocks -->
    <!-- Cluster A: Switch after T1 -->
    <rect x="0" y="20" width="90" height="50" fill="#e5e7eb" stroke="#ffffff" stroke-width="2" rx="4"/>
    <rect x="90" y="20" width="360" height="50" fill="#3b82f6" stroke="#ffffff" stroke-width="2" rx="4"/>

    <!-- Cluster B: Switch after T2 -->
    <rect x="0" y="80" width="180" height="50" fill="#e5e7eb" stroke="#ffffff" stroke-width="2" rx="4"/>
    <rect x="180" y="80" width="270" height="50" fill="#3b82f6" stroke="#ffffff" stroke-width="2" rx="4"/>

    <!-- Cluster C: Switch after T3 -->
    <rect x="0" y="140" width="270" height="50" fill="#e5e7eb" stroke="#ffffff" stroke-width="2" rx="4"/>
    <rect x="270" y="140" width="180" height="50" fill="#3b82f6" stroke="#ffffff" stroke-width="2" rx="4"/>

    <!-- Cluster D: Switch after T4 -->
    <rect x="0" y="200" width="360" height="50" fill="#e5e7eb" stroke="#ffffff" stroke-width="2" rx="4"/>
    <rect x="360" y="200" width="90" height="50" fill="#3b82f6" stroke="#ffffff" stroke-width="2" rx="4"/>
  </g>

  <!-- Legend -->
  <g transform="translate(280, 480)">
    <rect x="0" y="0" width="30" height="20" fill="#e5e7eb" rx="3"/>
    <text x="40" y="16" font-family="system-ui, sans-serif" font-size="14" fill="#475569">对照</text>
    <rect x="120" y="0" width="30" height="20" fill="#3b82f6" rx="3"/>
    <text x="160" y="16" font-family="system-ui, sans-serif" font-size="14" fill="#475569">干预</text>
  </g>

  <!-- Key Features -->
  <g transform="translate(100, 530)">
    <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
    <text x="15" y="5" font-family="system-ui, sans-serif" font-size="12" fill="#475569">所有集群最终接受干预</text>
    <circle cx="220" cy="0" r="4" fill="#3b82f6"/>
    <text x="235" y="5" font-family="system-ui, sans-serif" font-size="12" fill="#475569">伦理优势明显</text>
    <circle cx="420" cy="0" r="4" fill="#3b82f6"/>
    <text x="435" y="5" font-family="system-ui, sans-serif" font-size="12" fill="#475569">逐步推广策略</text>
  </g>
</svg>
