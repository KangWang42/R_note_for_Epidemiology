<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="火山图构建流程">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .title { font: 700 46px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .stepTitle { font: 700 26px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .stepText { font: 400 21px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #334155; }
      .arrow { stroke: #6366f1; stroke-width: 4; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="#ffffff"/>
  <text x="80" y="90" class="title">火山图构建流程（Volcano Plot Workflow）</text>

  <g transform="translate(80 150)">
    <rect x="0" y="0" width="280" height="220" rx="20" fill="url(#panel)" stroke="#c7d2fe" stroke-width="2"/>
    <text x="24" y="52" class="stepTitle">Step 1 数据准备</text>
    <text x="24" y="96" class="stepText">• 输入: gene, log2FC, pvalue</text>
    <text x="24" y="132" class="stepText">• 计算: padj (BH/FDR)</text>
    <text x="24" y="168" class="stepText">• 生成: -log10(padj)</text>
  </g>

  <g transform="translate(410 150)">
    <rect x="0" y="0" width="280" height="220" rx="20" fill="url(#panel)" stroke="#c7d2fe" stroke-width="2"/>
    <text x="24" y="52" class="stepTitle">Step 2 阈值设定</text>
    <text x="24" y="96" class="stepText">• padj &lt; 0.05</text>
    <text x="24" y="132" class="stepText">• |log2FC| &gt; 1</text>
    <text x="24" y="168" class="stepText">• 分组: Up / Down / NS</text>
  </g>

  <g transform="translate(740 150)">
    <rect x="0" y="0" width="280" height="220" rx="20" fill="url(#panel)" stroke="#c7d2fe" stroke-width="2"/>
    <text x="24" y="52" class="stepTitle">Step 3 绘图标注</text>
    <text x="24" y="96" class="stepText">• X: log2FC</text>
    <text x="24" y="132" class="stepText">• Y: -log10(padj)</text>
    <text x="24" y="168" class="stepText">• 重点基因标签</text>
  </g>

  <g transform="translate(1070 150)">
    <rect x="0" y="0" width="250" height="220" rx="20" fill="url(#panel)" stroke="#c7d2fe" stroke-width="2"/>
    <text x="24" y="52" class="stepTitle">Step 4 输出解释</text>
    <text x="24" y="96" class="stepText">• 结果解读</text>
    <text x="24" y="132" class="stepText">• 导出 PNG/PDF</text>
    <text x="24" y="168" class="stepText">• 记录阈值口径</text>
  </g>

  <path d="M360 260 L405 260" class="arrow"/>
  <path d="M690 260 L735 260" class="arrow"/>
  <path d="M1020 260 L1065 260" class="arrow"/>

  <g transform="translate(80 430)">
    <rect x="0" y="0" width="1240" height="280" rx="18" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="30" y="52" class="stepTitle">实践提示</text>
    <text x="30" y="98" class="stepText">1) 阈值要在图注中明确写出，避免“图看起来显著但规则不透明”。</text>
    <text x="30" y="138" class="stepText">2) 标签不要贪多，优先标注统计显著 + 生物学关键的候选分子。</text>
    <text x="30" y="178" class="stepText">3) 多对比场景建议统一阈值并分面展示，便于横向比较。</text>
    <text x="30" y="218" class="stepText">4) 发表前导出高分辨率 PNG 与矢量 PDF，保留可复现脚本。</text>
  </g>
</svg>
