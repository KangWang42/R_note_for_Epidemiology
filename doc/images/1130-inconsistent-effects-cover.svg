<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#grad1)"/>

  <!-- Abstract Scatter Plot Background -->
  <g opacity="0.1" stroke="#fff" stroke-width="1">
    <line x1="50" y1="350" x2="750" y2="350"/>
    <line x1="50" y1="350" x2="50" y2="50"/>
    <path d="M50,350 Q400,100 750,50" fill="none" stroke-width="2"/>
    <circle cx="200" cy="250" r="5" fill="#fff"/>
    <circle cx="300" cy="200" r="8" fill="#fff"/>
    <circle cx="500" cy="150" r="6" fill="#fff"/>
    <circle cx="600" cy="100" r="9" fill="#fff"/>
  </g>

  <text x="400" y="160" font-family="sans-serif" font-size="48" font-weight="bold" fill="#ecf0f1" text-anchor="middle" filter="url(#shadow)">回归效应不一致</text>
  <text x="400" y="220" font-family="sans-serif" font-size="28" fill="#bdc3c7" text-anchor="middle">Inconsistent Regression Effects</text>

  <rect x="250" y="260" width="300" height="2" fill="#e74c3c"/>

  <text x="400" y="300" font-family="sans-serif" font-size="18" fill="#95a5a6" text-anchor="middle">辛普森悖论 | 混杂效应 | 中介效应 | 抑制效应</text>
</svg>