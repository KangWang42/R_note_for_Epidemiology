<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600">
  <!-- Background -->
  <rect width="1400" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="50" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">回归系数不一致的三种典型机制 (DAG 因果图)</text>

  <!-- Common Styles -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <style>
      .node { fill: #f0f4f8; stroke: #2c3e50; stroke-width: 2; }
      .node-text { font-family: sans-serif; font-size: 20; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #2c3e50; }
      .label-text { font-family: sans-serif; font-size: 16; fill: #555; text-anchor: middle; }
      .edge { stroke: #666; stroke-width: 2; marker-end: url(#arrow); }
      .panel-title { font-family: sans-serif; font-size: 24; font-weight: bold; fill: #2c3e50; text-anchor: middle; }
      .desc-text { font-family: sans-serif; font-size: 16; fill: #666; text-anchor: middle; }
    </style>
  </defs>

  <!-- Panel 1: Confounding (混杂) -->
  <g transform="translate(100, 100)">
    <text x="200" y="0" class="panel-title">1. 混杂效应 (Confounding)</text>
    <text x="200" y="30" class="desc-text">X 与 Y 无因果，Z 同时导致 X 和 Y</text>

    <!-- Nodes -->
    <circle cx="100" cy="250" r="40" class="node"/>
    <text x="100" y="250" class="node-text">X</text>

    <circle cx="300" cy="250" r="40" class="node"/>
    <text x="300" y="250" class="node-text">Y</text>

    <circle cx="200" cy="120" r="40" class="node" style="stroke: #e74c3c;"/>
    <text x="200" y="120" class="node-text">Z</text>

    <!-- Edges -->
    <line x1="180" y1="145" x2="120" y2="220" class="edge"/> <!-- Z -> X -->
    <line x1="220" y1="145" x2="280" y2="220" class="edge"/> <!-- Z -> Y -->
    <line x1="140" y1="250" x2="260" y2="250" class="edge" style="stroke-dasharray: 5,5; marker-end: none;"/> <!-- X - Y correlation -->
    <text x="200" y="270" class="label-text" fill="#999">虚假关联</text>

    <!-- Result Box -->
    <rect x="50" y="320" width="300" height="80" rx="10" fill="#fcf3cf" stroke="#f1c40f"/>
    <text x="200" y="350" class="label-text" font-weight="bold">结果表现</text>
    <text x="200" y="375" class="label-text">单因素显著 -> 多因素不显著</text>
  </g>

  <!-- Panel 2: Mediation (中介) -->
  <g transform="translate(500, 100)">
    <text x="200" y="0" class="panel-title">2. 中介效应 (Mediation)</text>
    <text x="200" y="30" class="desc-text">X 通过 M 导致 Y</text>

    <!-- Nodes -->
    <circle cx="50" cy="200" r="40" class="node"/>
    <text x="50" y="200" class="node-text">X</text>

    <circle cx="200" cy="200" r="40" class="node" style="stroke: #27ae60;"/>
    <text x="200" y="200" class="node-text">M</text>

    <circle cx="350" cy="200" r="40" class="node"/>
    <text x="350" y="200" class="node-text">Y</text>

    <!-- Edges -->
    <line x1="90" y1="200" x2="160" y2="200" class="edge"/> <!-- X -> M -->
    <line x1="240" y1="200" x2="310" y2="200" class="edge"/> <!-- M -> Y -->

    <!-- Result Box -->
    <rect x="50" y="320" width="300" height="80" rx="10" fill="#d5f5e3" stroke="#27ae60"/>
    <text x="200" y="350" class="label-text" font-weight="bold">结果表现</text>
    <text x="200" y="375" class="label-text">单因素显著 -> 多因素系数减小</text>
  </g>

  <!-- Panel 3: Suppression (抑制) -->
  <g transform="translate(900, 100)">
    <text x="200" y="0" class="panel-title">3. 抑制效应 (Suppression)</text>
    <text x="200" y="30" class="desc-text">Z 掩盖了 X 的真实作用</text>

    <!-- Nodes -->
    <circle cx="100" cy="250" r="40" class="node"/>
    <text x="100" y="250" class="node-text">X</text>

    <circle cx="300" cy="250" r="40" class="node"/>
    <text x="300" y="250" class="node-text">Y</text>

    <circle cx="200" cy="120" r="40" class="node" style="stroke: #8e44ad;"/>
    <text x="200" y="120" class="node-text">Z</text>

    <!-- Edges -->
    <line x1="180" y1="145" x2="120" y2="220" class="edge"/> <!-- Z -> X -->
    <line x1="220" y1="145" x2="280" y2="220" class="edge"/> <!-- Z -> Y -->
    <line x1="140" y1="250" x2="260" y2="250" class="edge"/> <!-- X -> Y -->

    <!-- Signs -->
    <text x="130" y="180" class="label-text" fill="#c0392b" font-weight="bold">(+)</text>
    <text x="270" y="180" class="label-text" fill="#c0392b" font-weight="bold">(+)</text>
    <text x="200" y="240" class="label-text" fill="#2980b9" font-weight="bold">(-)</text>

    <!-- Result Box -->
    <rect x="50" y="320" width="300" height="80" rx="10" fill="#ebe4f3" stroke="#8e44ad"/>
    <text x="200" y="350" class="label-text" font-weight="bold">结果表现</text>
    <text x="200" y="375" class="label-text">单因素不显著 -> 多因素显著</text>
  </g>

  <!-- Divider lines -->
  <line x1="450" y1="100" x2="450" y2="450" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="850" y1="100" x2="850" y2="450" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5"/>

</svg>