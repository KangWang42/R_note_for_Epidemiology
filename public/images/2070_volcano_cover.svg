    <line x1="130" y1="480" x2="1230" y2="480" stroke="#94a3b8" stroke-width="2"/>
    <line x1="680" y1="80" x2="680" y2="480" stroke="#94a3b8" stroke-width="2"/>

    <line x1="500" y1="80" x2="500" y2="480" stroke="#64748b" stroke-dasharray="8 8"/>
    <line x1="860" y1="80" x2="860" y2="480" stroke="#64748b" stroke-dasharray="8 8"/>
    <line x1="130" y1="260" x2="1230" y2="260" stroke="#64748b" stroke-dasharray="8 8"/>

    <g fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24">
      <text x="1120" y="520">log2FC</text>
      <text x="30" y="110" transform="rotate(-90 30 110)">-log10(padj)</text>
    </g>

    <g opacity="0.9">
      <circle cx="320" cy="210" r="8" fill="#38bdf8"/>
      <circle cx="360" cy="180" r="7" fill="#38bdf8"/>
      <circle cx="400" cy="240" r="6" fill="#38bdf8"/>
      <circle cx="960" cy="170" r="9" fill="#fb7185"/>
      <circle cx="1020" cy="220" r="7" fill="#fb7185"/>
      <circle cx="900" cy="250" r="6" fill="#fb7185"/>
