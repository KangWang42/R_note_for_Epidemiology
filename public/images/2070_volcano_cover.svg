      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.13">
    <circle cx="190" cy="120" r="120" fill="#38bdf8"/>
    <circle cx="1490" cy="760" r="160" fill="#f43f5e"/>
    <circle cx="1380" cy="150" r="90" fill="#facc15"/>
