<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/><stop offset="100%" style="stop-color:#3a0ca3"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4cc9f0"/><stop offset="100%" style="stop-color:#4361ee"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- ECG -->
  <path d="M0 45 L120 45 L130 25 L140 70 L150 45 L400 45" stroke="#4cc9f0" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- state machine -->
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="20" y="100" width="58" height="30" rx="6" fill="url(#chip)"/><text x="49" y="119" fill="#0d1b2a" font-weight="bold">PLAN</text>
    <rect x="95" y="100" width="58" height="30" rx="6" fill="url(#chip)"/><text x="124" y="119" fill="#0d1b2a" font-weight="bold">CODE</text>
    <rect x="170" y="100" width="50" height="30" rx="6" fill="url(#chip)"/><text x="195" y="119" fill="#0d1b2a" font-weight="bold">RUN</text>
    <rect x="237" y="100" width="62" height="30" rx="6" fill="url(#chip)"/><text x="268" y="119" fill="#0d1b2a" font-weight="bold">VERIFY</text>
    <rect x="316" y="100" width="52" height="30" rx="6" fill="url(#chip)"/><text x="342" y="119" fill="#0d1b2a" font-weight="bold">DOC</text>
  </g>
  <g stroke="#f72585" stroke-width="2" opacity="0.7">
    <line x1="78" y1="115" x2="93" y2="115"/><line x1="153" y1="115" x2="168" y2="115"/>
    <line x1="220" y1="115" x2="235" y2="115"/><line x1="299" y1="115" x2="314" y2="115"/>
  </g>
  <text x="200" y="165" fill="#a9d6e5" font-family="monospace" font-size="10" text-anchor="middle">Rscript → 全量扫 error/warning → results.yaml</text>
  <text x="200" y="222" fill="#f8f9fa" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">r-biostats</text>
  <text x="200" y="240" fill="#4cc9f0" font-family="Arial" font-size="10" text-anchor="middle">流行病学与生物统计分析执行层</text>
</svg>
