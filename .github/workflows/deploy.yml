name: Deploy to Server

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Verify published assets
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            custom-sidebar.css
            custom-sidebar.js
            home.css
            site-interactions.js
            styles.css
            theme-toggle.js
          )

          for asset in "${assets[@]}"; do
            if [[ ! -s "public/${asset}" ]]; then
              echo "::error file=public/${asset}::Published asset is missing or empty"
              exit 1
            fi

            if ! cmp --silent "doc/${asset}" "public/${asset}"; then
              echo "::error file=public/${asset}::Published asset is stale; render the site before deployment"
              exit 1
            fi
          done

      - name: Deploy public to server
        shell: bash
        run: |
          set -euo pipefail
          rsync -azc --delete --itemize-changes -e "ssh" ./public/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "chown -R 1000:1000 ${{ secrets.SERVER_PATH }}"

      - name: Verify server mirror
        shell: bash
        run: |
          set -euo pipefail

          drift="$(rsync -rlzcn --delete --out-format='%i %n%L' -e "ssh" ./public/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/)"
          if [[ -n "${drift}" ]]; then
            echo "::error::Server files differ from the published site after deployment"
            printf '%s\n' "${drift}"
            exit 1
          fi
