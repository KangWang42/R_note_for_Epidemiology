<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient: Deep blue to purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#4338ca;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Hook gradient -->
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <radialGradient id="glowGrad">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Filter for shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative grid pattern -->
  <g stroke="#4f46e5" stroke-width="1" opacity="0.15">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Glow effects -->
  <circle cx="300" cy="315" r="200" fill="url(#glowGrad)" opacity="0.5"/>
  <circle cx="900" cy="315" r="150" fill="url(#glowGrad)" opacity="0.3"/>
  
  <!-- Central workflow diagram -->
  <!-- Left node: Pre-hook -->
  <g filter="url(#shadow)">
    <rect x="150" y="260" width="180" height="110" rx="12" fill="#1e1b4b" stroke="url(#hookGrad)" stroke-width="3"/>
    <text x="240" y="300" fill="#60a5fa" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Pre-Hook</text>
    <text x="240" y="330" fill="#94a3b8" font-family="'Segoe UI', Arial" font-size="16" text-anchor="middle">前置钩子</text>
    <text x="240" y="355" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">setup • validate</text>
  </g>
  
  <!-- Center node: Main Process -->
  <g filter="url(#shadow)">
    <rect x="430" y="240" width="340" height="150" rx="16" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="4"/>
    <text x="600" y="290" fill="#34d399" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">Main Process</text>
    <text x="600" y="325" fill="#94a3b8" font-family="'Segoe UI', Arial" font-size="20" text-anchor="middle">核心工作流</text>
    <text x="600" y="360" fill="#64748b" font-family="monospace" font-size="14" text-anchor="middle">execute • transform • output</text>
  </g>
  
  <!-- Right node: Post-hook -->
  <g filter="url(#shadow)">
    <rect x="870" y="260" width="180" height="110" rx="12" fill="#1e1b4b" stroke="url(#hookGrad)" stroke-width="3"/>
    <text x="960" y="300" fill="#60a5fa" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Post-Hook</text>
    <text x="960" y="330" fill="#94a3b8" font-family="'Segoe UI', Arial" font-size="16" text-anchor="middle">后置钩子</text>
    <text x="960" y="355" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">cleanup • notify</text>
  </g>
  
  <!-- Connection arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#60a5fa"/>
    </marker>
  </defs>
  
  <!-- Pre to Main arrow -->
  <path d="M 330 315 L 430 315" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Main to Post arrow -->
  <path d="M 770 315 L 870 315" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Animated flow dots -->
  <g fill="#60a5fa">
    <circle cx="330" cy="315" r="5">
      <animate attributeName="cx" from="330" to="430" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="315" r="5">
      <animate attributeName="cx" from="770" to="870" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Hook symbols (decorative) -->
  <!-- Left hook icon -->
  <g transform="translate(180, 180)">
    <path d="M 20 0 Q 40 0 40 20 L 40 50 Q 40 70 20 70" 
          stroke="#60a5fa" stroke-width="4" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Right hook icon -->
  <g transform="translate(980, 180)">
    <path d="M 40 0 Q 20 0 20 20 L 20 50 Q 20 70 40 70" 
          stroke="#60a5fa" stroke-width="4" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Additional hook details (top) -->
  <g opacity="0.6">
    <text x="600" y="140" fill="#94a3b8" font-family="'Segoe UI', Arial" font-size="16" text-anchor="middle">Lifecycle Events</text>
    <text x="600" y="165" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">on_init • on_process • on_complete • on_error</text>
  </g>
  
  <!-- Additional details (bottom) -->
  <g opacity="0.6">
    <text x="600" y="480" fill="#94a3b8" font-family="'Segoe UI', Arial" font-size="16" text-anchor="middle">Hook Types</text>
    <text x="600" y="505" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">sync • async • conditional • chained</text>
  </g>
  
  <!-- OpenCode badge -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="180" height="45" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="140" y="70" fill="#6366f1" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">OpenCode</text>
  </g>
  
  <!-- Version/Tag -->
  <rect x="970" y="40" width="180" height="45" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" opacity="0.9"/>
  <text x="1060" y="70" fill="#10b981" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">Hooks System</text>
  
  <!-- Title section -->
  <g filter="url(#shadow)">
    <text x="600" y="565" fill="#f1f5f9" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle">OpenCode Hooks</text>
    <text x="600" y="600" fill="#cbd5e1" font-family="'Segoe UI', Arial" font-size="24" text-anchor="middle">钩子系统详解与实战</text>
  </g>
</svg>
