<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>
  
  <!-- Node 1: Computer -->
  <rect x="60" y="160" width="120" height="80" rx="8" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <rect x="80" y="175" width="80" height="45" rx="4" fill="#1e3a5f"/>
  <text x="120" y="202" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12">💻</text>
  <rect x="95" y="225" width="50" height="5" rx="2" fill="#334155"/>
  <text x="120" y="255" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Client</text>
  
  <!-- Arrow 1 -->
  <line x1="185" y1="200" x2="280" y2="200" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="278,194 290,200 278,206" fill="#38bdf8"/>
  <text x="232" y="190" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9">Hysteria 2</text>
  <text x="232" y="218" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">UDP/QUIC</text>
  
  <!-- Node 2: VPS -->
  <rect x="295" y="150" width="130" height="100" rx="8" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
  <rect x="310" y="165" width="100" height="50" rx="6" fill="#1e1b4b"/>
  <g transform="translate(360,185)">
    <rect x="-15" y="-8" width="30" height="16" rx="3" fill="#312e81"/>
    <line x1="-10" y1="-3" x2="10" y2="-3" stroke="#818cf8" stroke-width="1"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#818cf8" stroke-width="1"/>
    <line x1="-10" y1="3" x2="10" y2="3" stroke="#818cf8" stroke-width="1"/>
    <circle cx="12" cy="-3" r="1.5" fill="#34d399"/>
  </g>
  <text x="360" y="230" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="11">VPS</text>
  <text x="360" y="243" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9">Los Angeles</text>
  
  <!-- Arrow 2 -->
  <line x1="430" y1="200" x2="520" y2="200" stroke="url(#green)" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="518,194 530,200 518,206" fill="#34d399"/>
  <text x="475" y="190" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9">SOCKS5</text>
  
  <!-- Node 3: Residential IP -->
  <rect x="535" y="155" width="120" height="90" rx="8" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
  <text x="595" y="192" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="22">🏠</text>
  <text x="595" y="215" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="10">Residential IP</text>
  <text x="595" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9">US Clean IP</text>
  
  <!-- Arrow 3 -->
  <line x1="660" y1="200" x2="695" y2="200" stroke="#34d399" stroke-width="2"/>
  <polygon points="693,194 705,200 693,206" fill="#34d399"/>
  
  <!-- Node 4: ChatGPT -->
  <circle cx="735" cy="200" r="35" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
  <text x="735" y="195" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="10">Chat</text>
  <text x="735" y="210" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="10">GPT</text>
  
  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-weight="bold" font-size="26">VPS 代理搭建完全指南</text>
  <text x="400" y="85" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Hysteria 2 + 住宅 IP → ChatGPT 稳定访问</text>
  
  <!-- Latency labels -->
  <text x="200" y="310" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">~170ms</text>
  <text x="475" y="310" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">~5ms</text>
  <text x="680" y="310" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">~1ms</text>
  
  <!-- Bottom bar -->
  <rect x="150" y="340" width="500" height="30" rx="15" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="400" y="360" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="12">Total Latency ≈ 276ms  |  0-RTT QUIC  |  Anti-Ban</text>
  
  <!-- Decorative dots -->
  <circle cx="50" cy="50" r="3" fill="#38bdf8" opacity="0.3"/>
  <circle cx="750" cy="50" r="3" fill="#818cf8" opacity="0.3"/>
  <circle cx="50" cy="350" r="3" fill="#34d399" opacity="0.3"/>
  <circle cx="750" cy="350" r="3" fill="#f59e0b" opacity="0.3"/>
</svg>