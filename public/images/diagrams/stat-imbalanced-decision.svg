<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 28px; font-weight: bold; fill: #1a202c; }
      .subtitle { font-family: sans-serif; font-size: 16px; fill: #4a5568; }
      .node-box { fill: #ffffff; stroke: #cbd5e0; stroke-width: 2; }
      .node-title { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #2d3748; }
      .node-desc { font-family: sans-serif; font-size: 12px; fill: #718096; }
      .arrow { stroke: #4299e1; stroke-width: 2; fill: none; }
      .label-box { fill: #ebf8ff; rx: 4; }
      .label-text { font-family: sans-serif; font-size: 11px; fill: #2b6cb0; }
      .method-box { fill: #f0fff4; stroke: #9ae6b4; stroke-width: 2; }
      .method-title { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #276749; }
      .method-desc { font-family: sans-serif; font-size: 11px; fill: #2f855a; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#f7fafc"/>

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" class="title">不平衡数据处理策略决策图</text>
  <text x="700" y="75" text-anchor="middle" class="subtitle">根据数据规模和不平衡程度选择合适的处理方法</text>

  <!-- Level 1: Assessment -->
  <g transform="translate(550, 100)">
    <rect x="0" y="0" width="300" height="80" rx="10" class="node-box"/>
    <text x="150" y="30" text-anchor="middle" class="node-title">步骤1：诊断评估</text>
    <text x="150" y="50" text-anchor="middle" class="node-desc">计算不平衡比率(IR)</text>
    <text x="150" y="68" text-anchor="middle" class="node-desc">确定少数类占比</text>
  </g>

  <!-- Arrow from Level 1 to Level 2 -->
  <line x1="700" y1="180" x2="700" y2="210" class="arrow"/>
  <polygon points="700,210 695,200 705,200" fill="#4299e1"/>

  <!-- Level 2: Branch by severity -->
  <!-- Mild Imbalance -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="200" height="100" rx="10" class="node-box"/>
    <text x="100" y="30" text-anchor="middle" class="node-title">轻度不平衡</text>
    <text x="100" y="55" text-anchor="middle" class="node-desc">少数类占比 &gt; 10%</text>
    <text x="100" y="75" text-anchor="middle" class="node-desc">不平衡比率 &gt; 0.1</text>
  </g>

  <!-- Moderate Imbalance -->
  <g transform="translate(350, 220)">
    <rect x="0" y="0" width="200" height="100" rx="10" class="node-box"/>
    <text x="100" y="30" text-anchor="middle" class="node-title">中度不平衡</text>
    <text x="100" y="55" text-anchor="middle" class="node-desc">占比 1%-10%</text>
    <text x="100" y="75" text-anchor="middle" class="node-desc">IR: 0.01-0.1</text>
  </g>

  <!-- Severe Imbalance -->
  <g transform="translate(850, 220)">
    <rect x="0" y="0" width="200" height="100" rx="10" class="node-box"/>
    <text x="100" y="30" text-anchor="middle" class="node-title">重度不平衡</text>
    <text x="100" y="55" text-anchor="middle" class="node-desc">占比 &lt; 1%</text>
    <text x="100" y="75" text-anchor="middle" class="node-desc">IR &lt; 0.01</text>
  </g>

  <!-- Arrows to Level 3 -->
  <line x1="180" y1="320" x2="180" y2="380" class="arrow"/>
  <line x1="450" y1="320" x2="450" y2="380" class="arrow"/>
  <line x1="950" y1="320" x2="950" y2="380" class="arrow"/>

  <!-- Level 3: Solutions -->
  <!-- Mild solution -->
  <g transform="translate(80, 390)">
    <rect x="0" y="0" width="200" height="90" rx="10" class="method-box"/>
    <text x="100" y="30" text-anchor="middle" class="method-title">无需处理</text>
    <text x="100" y="55" text-anchor="middle" class="method-desc">标准方法已足够</text>
    <text x="100" y="75" text-anchor="middle" class="method-desc">或仅需阈值微调</text>
  </g>

  <!-- Moderate solutions -->
  <g transform="translate(320, 390)">
    <rect x="0" y="0" width="120" height="90" rx="10" class="method-box"/>
    <text x="60" y="35" text-anchor="middle" class="method-title">类别权重</text>
    <text x="60" y="60" text-anchor="middle" class="method-desc">简单有效</text>
    <text x="60" y="78" text-anchor="middle" class="method-desc">优先选择</text>
  </g>

  <g transform="translate(460, 390)">
    <rect x="0" y="0" width="120" height="90" rx="10" class="method-box"/>
    <text x="60" y="35" text-anchor="middle" class="method-title">SMOTE</text>
    <text x="60" y="60" text-anchor="middle" class="method-desc">合成采样</text>
    <text x="60" y="78" text-anchor="middle" class="method-desc">减少过拟合</text>
  </g>

  <!-- Severe solutions -->
  <g transform="translate(800, 390)">
    <rect x="0" y="0" width="120" height="90" rx="10" class="method-box"/>
    <text x="60" y="35" text-anchor="middle" class="method-title">SMOTE+</text>
    <text x="60" y="60" text-anchor="middle" class="method-title">加权模型</text>
    <text x="60" y="78" text-anchor="middle" class="method-desc">组合策略</text>
  </g>

  <g transform="translate(940, 390)">
    <rect x="0" y="0" width="120" height="90" rx="10" class="method-box"/>
    <text x="60" y="35" text-anchor="middle" class="method-title">集成学习</text>
    <text x="60" y="60" text-anchor="middle" class="method-desc">EasyEnsemble</text>
    <text x="60" y="78" text-anchor="middle" class="method-desc">Balanced RF</text>
  </g>

  <!-- Labels on arrows -->
  <rect x="115" y="340" width="130" height="24" class="label-box"/>
  <text x="180" y="356" text-anchor="middle" class="label-text">样本量充足</text>

  <rect x="385" y="340" width="130" height="24" class="label-box"/>
  <text x="450" y="356" text-anchor="middle" class="label-text">中等样本量</text>

  <rect x="885" y="340" width="130" height="24" class="label-box"/>
  <text x="950" y="356" text-anchor="middle" class="label-text">大样本/少数类极少</text>

  <!-- Level 4: Threshold optimization -->
  <g transform="translate(450, 520)">
    <rect x="0" y="0" width="500" height="60" rx="10" class="node-box"/>
    <text x="250" y="25" text-anchor="middle" class="node-title">通用：阈值优化</text>
    <text x="250" y="48" text-anchor="middle" class="node-desc">Youden指数 / 最大化F1 / 成本敏感阈值</text>
  </g>

  <!-- Arrows from Level 3 to Level 4 -->
  <line x1="180" y1="480" x2="520" y2="520" class="arrow"/>
  <line x1="450" y1="480" x2="580" y2="520" class="arrow"/>
  <line x1="860" y1="480" x2="700" y2="520" class="arrow"/>

  <!-- Level 5: Evaluation -->
  <g transform="translate(550, 620)">
    <rect x="0" y="0" width="300" height="70" rx="10" class="node-box"/>
    <text x="150" y="25" text-anchor="middle" class="node-title">评估与验证</text>
    <text x="150" y="48" text-anchor="middle" class="node-desc">AUC + PR-AUC + 敏感度 + 特异度 + F1</text>
    <text x="150" y="65" text-anchor="middle" class="node-desc">交叉验证 + 独立测试集</text>
  </g>

  <!-- Arrow to evaluation -->
  <line x1="700" y1="580" x2="700" y2="620" class="arrow"/>
  <polygon points="700,620 695,610 705,610" fill="#4299e1"/>

  <!-- Decision notes -->
  <g transform="translate(1100, 400)">
    <rect x="0" y="0" width="250" height="180" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="2"/>
    <text x="125" y="25" text-anchor="middle" class="node-title" fill="#c53030">⚠️ 注意事项</text>
    <text x="15" y="50" class="node-desc" fill="#742a2a">• 只对训练集采样</text>
    <text x="15" y="70" class="node-desc" fill="#742a2a">• 不要只看准确率</text>
    <text x="15" y="90" class="node-desc" fill="#742a2a">• 使用PR曲线评估</text>
    <text x="15" y="110" class="node-desc" fill="#742a2a">• 根据业务需求选阈值</text>
    <text x="15" y="130" class="node-desc" fill="#742a2a">• 验证泛化能力</text>
    <text x="15" y="150" class="node-desc" fill="#742a2a">• 报告完整指标</text>
    <text x="15" y="170" class="node-desc" fill="#742a2a">• 优先简单方法</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 650)">
    <rect x="0" y="0" width="15" height="15" fill="#f0fff4" stroke="#9ae6b4" stroke-width="2"/>
    <text x="25" y="12" class="node-desc">推荐方法</text>

    <rect x="150" y="0" width="15" height="15" fill="#ffffff" stroke="#cbd5e0" stroke-width="2"/>
    <text x="175" y="12" class="node-desc">评估步骤</text>
  </g>
</svg>
