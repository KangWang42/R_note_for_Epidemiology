<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="#ffffff" opacity="0.1"/>
  <circle cx="1100" cy="530" r="120" fill="#ffffff" opacity="0.1"/>
  <circle cx="1050" cy="100" r="50" fill="#ffffff" opacity="0.05"/>

  <!-- Main visual: Balanced vs Imbalanced -->
  <g transform="translate(100, 150)">
    <!-- Balanced panel -->
    <rect x="0" y="0" width="400" height="280" rx="12" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>

    <!-- Balanced dots - equal distribution -->
    <g transform="translate(30, 40)">
      <text x="170" y="-10" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4a5568">平衡数据 (50% vs 50%)</text>

      <!-- Green dots (majority) -->
      <circle cx="50" cy="40" r="8" fill="#48bb78"/>
      <circle cx="100" cy="60" r="8" fill="#48bb78"/>
      <circle cx="150" cy="35" r="8" fill="#48bb78"/>
      <circle cx="200" cy="55" r="8" fill="#48bb78"/>
      <circle cx="250" cy="40" r="8" fill="#48bb78"/>
      <circle cx="300" cy="65" r="8" fill="#48bb78"/>
      <circle cx="75" cy="90" r="8" fill="#48bb78"/>
      <circle cx="125" cy="110" r="8" fill="#48bb78"/>
      <circle cx="175" cy="85" r="8" fill="#48bb78"/>
      <circle cx="225" cy="105" r="8" fill="#48bb78"/>
      <circle cx="275" cy="90" r="8" fill="#48bb78"/>
      <circle cx="50" cy="140" r="8" fill="#48bb78"/>
      <circle cx="100" cy="160" r="8" fill="#48bb78"/>
      <circle cx="150" cy="135" r="8" fill="#48bb78"/>
      <circle cx="200" cy="155" r="8" fill="#48bb78"/>
      <circle cx="250" cy="140" r="8" fill="#48bb78"/>
      <circle cx="300" cy="165" r="8" fill="#48bb78"/>

      <!-- Red dots (minority) -->
      <circle cx="75" cy="55" r="8" fill="#f56565"/>
      <circle cx="125" cy="75" r="8" fill="#f56565"/>
      <circle cx="175" cy="50" r="8" fill="#f56565"/>
      <circle cx="225" cy="70" r="8" fill="#f56565"/>
      <circle cx="275" cy="55" r="8" fill="#f56565"/>
      <circle cx="325" cy="80" r="8" fill="#f56565"/>
      <circle cx="50" cy="105" r="8" fill="#f56565"/>
      <circle cx="100" cy="125" r="8" fill="#f56565"/>
      <circle cx="150" cy="100" r="8" fill="#f56565"/>
      <circle cx="200" cy="120" r="8" fill="#f56565"/>
      <circle cx="250" cy="105" r="8" fill="#f56565"/>
      <circle cx="300" cy="130" r="8" fill="#f56565"/>
      <circle cx="75" cy="170" r="8" fill="#f56565"/>
      <circle cx="125" cy="190" r="8" fill="#f56565"/>
      <circle cx="175" cy="165" r="8" fill="#f56565"/>
      <circle cx="225" cy="185" r="8" fill="#f56565"/>

      <!-- Decision boundary -->
      <line x1="0" y1="95" x2="340" y2="95" stroke="#2d3748" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
      <text x="330" y="115" text-anchor="end" font-family="sans-serif" font-size="11" fill="#718096">决策边界清晰</text>
    </g>
  </g>

  <!-- Imbalanced panel -->
  <g transform="translate(550, 150)">
    <rect x="0" y="0" width="400" height="280" rx="12" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>

    <g transform="translate(30, 40)">
      <text x="170" y="-10" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4a5568">不平衡数据 (5% vs 95%)</text>

      <!-- Many green dots (majority overwhelming) -->
      <g fill="#48bb78">
        <circle cx="40" cy="35" r="6"/><circle cx="60" cy="45" r="6"/><circle cx="80" cy="32" r="6"/>
        <circle cx="100" cy="50" r="6"/><circle cx="120" cy="38" r="6"/><circle cx="140" cy="48" r="6"/>
        <circle cx="160" cy="33" r="6"/><circle cx="180" cy="52" r="6"/><circle cx="200" cy="40" r="6"/>
        <circle cx="220" cy="55" r="6"/><circle cx="240" cy="35" r="6"/><circle cx="260" cy="50" r="6"/>
        <circle cx="280" cy="38" r="6"/><circle cx="300" cy="48" r="6"/><circle cx="320" cy="42" r="6"/>
        <circle cx="340" cy="52" r="6"/><circle cx="50" cy="60" r="6"/><circle cx="70" cy="70" r="6"/>
        <circle cx="90" cy="58" r="6"/><circle cx="110" cy="72" r="6"/><circle cx="130" cy="62" r="6"/>
        <circle cx="150" cy="75" r="6"/><circle cx="170" cy="65" r="6"/><circle cx="190" cy="73" r="6"/>
        <circle cx="210" cy="63" r="6"/><circle cx="230" cy="76" r="6"/><circle cx="250" cy="60" r="6"/>
        <circle cx="270" cy="74" r="6"/><circle cx="290" cy="64" r="6"/><circle cx="310" cy="70" r="6"/>
        <circle cx="330" cy="58" r="6"/><circle cx="45" cy="85" r="6"/><circle cx="65" cy="95" r="6"/>
        <circle cx="85" cy="83" r="6"/><circle cx="105" cy="97" r="6"/><circle cx="125" cy="87" r="6"/>
        <circle cx="145" cy="100" r="6"/><circle cx="165" cy="90" r="6"/><circle cx="185" cy="98" r="6"/>
        <circle cx="205" cy="88" r="6"/><circle cx="225" cy="101" r="6"/><circle cx="245" cy="85" r="6"/>
        <circle cx="265" cy="99" r="6"/><circle cx="285" cy="89" r="6"/><circle cx="305" cy="95" r="6"/>
        <circle cx="325" cy="83" r="6"/><circle cx="340" cy="105" r="6"/><circle cx="55" cy="110" r="6"/>
        <circle cx="75" cy="120" r="6"/><circle cx="95" cy="108" r="6"/><circle cx="115" cy="122" r="6"/>
        <circle cx="135" cy="112" r="6"/><circle cx="155" cy="125" r="6"/><circle cx="175" cy="115" r="6"/>
        <circle cx="195" cy="123" r="6"/><circle cx="215" cy="113" r="6"/><circle cx="235" cy="126" r="6"/>
        <circle cx="255" cy="110" r="6"/><circle cx="275" cy="124" r="6"/><circle cx="295" cy="114" r="6"/>
        <circle cx="315" cy="120" r="6"/><circle cx="335" cy="108" r="6"/><circle cx="40" cy="135" r="6"/>
        <circle cx="60" cy="145" r="6"/><circle cx="80" cy="133" r="6"/><circle cx="100" cy="147" r="6"/>
        <circle cx="120" cy="137" r="6"/><circle cx="140" cy="150" r="6"/><circle cx="160" cy="140" r="6"/>
        <circle cx="180" cy="148" r="6"/><circle cx="200" cy="138" r="6"/><circle cx="220" cy="151" r="6"/>
        <circle cx="240" cy="135" r="6"/><circle cx="260" cy="149" r="6"/><circle cx="280" cy="139" r="6"/>
        <circle cx="300" cy="145" r="6"/><circle cx="320" cy="133" r="6"/><circle cx="340" cy="155" r="6"/>
        <circle cx="50" cy="160" r="6"/><circle cx="70" cy="170" r="6"/><circle cx="90" cy="158" r="6"/>
        <circle cx="110" cy="172" r="6"/><circle cx="130" cy="162" r="6"/><circle cx="150" cy="175" r="6"/>
        <circle cx="170" cy="165" r="6"/><circle cx="190" cy="173" r="6"/><circle cx="210" cy="163" r="6"/>
        <circle cx="230" cy="176" r="6"/><circle cx="250" cy="160" r="6"/><circle cx="270" cy="174" r="6"/>
        <circle cx="290" cy="164" r="6"/><circle cx="310" cy="170" r="6"/><circle cx="330" cy="158" r="6"/>
      </g>

      <!-- Only a few red dots (minority class) -->
      <g fill="#f56565">
        <circle cx="125" cy="55" r="7"/>
        <circle cx="275" cy="65" r="7"/>
        <circle cx="95" cy="115" r="7"/>
        <circle cx="305" cy="125" r="7"/>
      </g>

      <!-- Arrow showing imbalance -->
      <path d="M 170 180 L 170 195" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="170" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e53e3e" font-weight="bold">少数类被淹没</text>
    </g>
  </g>

  <!-- Title text -->
  <text x="100" y="520" font-family="sans-serif" font-size="42" font-weight="bold" fill="#ffffff">结局变量不平衡处理</text>
  <text x="100" y="570" font-family="sans-serif" font-size="24" fill="#ffffff" opacity="0.9">从诊断到验证的系统处理策略</text>

  <!-- Method tags -->
  <g transform="translate(700, 500)">
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#ffffff" opacity="0.2"/>
    <text x="55" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">SMOTE</text>
  </g>
  <g transform="translate(830" y="500)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#ffffff" opacity="0.2"/>
    <text x="65" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">类别权重</text>
  </g>
  <g transform="translate(980" y="500)">
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#ffffff" opacity="0.2"/>
    <text x="55" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">阈值优化</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e53e3e"/>
    </marker>
  </defs>
</svg>
