<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b579a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3d6d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d24726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a33a1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="excelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#217346;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#165534;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="featureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64b5f6" opacity="0.7"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="1400" height="800" fill="#f8fafc"/>
  <rect width="1400" height="800" fill="url(#mainGrad)" opacity="0.05"/>
  
  <!-- 标题 -->
  <text x="700" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#1e3a5f">officer 功能架构</text>
  <text x="700" y="95" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#64748b">R语言操作Microsoft Office文档的统一API</text>
  
  <!-- 中央核心 -->
  <g transform="translate(620, 150)" filter="url(#shadow)">
    <circle cx="80" cy="80" r="70" fill="url(#mainGrad)"/>
    <text x="80" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">officer</text>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#90cdf4">R Package</text>
  </g>
  
  <!-- 连接线 -->
  <line x1="700" y1="250" x2="700" y2="280" stroke="#64b5f6" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="700" y1="280" x2="250" y2="320" stroke="#64b5f6" stroke-width="2" opacity="0.6" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="280" x2="700" y2="320" stroke="#64b5f6" stroke-width="2" opacity="0.6" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="280" x2="1150" y2="320" stroke="#64b5f6" stroke-width="2" opacity="0.6" marker-end="url(#arrowhead)"/>
  
  <!-- Word 模块 -->
  <g transform="translate(50, 320)" filter="url(#shadow)">
    <!-- 卡片背景 -->
    <rect width="400" height="420" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- 顶部色块 -->
    <rect x="0" y="0" width="400" height="60" rx="12" fill="url(#wordGrad)"/>
    <rect x="0" y="45" width="400" height="15" fill="url(#wordGrad)"/>
    
    <!-- 图标 -->
    <rect x="20" y="15" width="35" height="35" rx="4" fill="white" opacity="0.2"/>
    <text x="37" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">W</text>
    <text x="70" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="white">Word</text>
    
    <!-- 功能列表 -->
    <g transform="translate(20, 80)">
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2b579a">文档操作</text>
      <rect x="0" y="28" width="360" height="1" fill="#e2e8f0"/>
      
      <text x="0" y="55" font-family="'Consolas', monospace" font-size="12" fill="#475569">read_docx()</text>
      <text x="140" y="55" font-family="Arial, sans-serif" font-size="12" fill="#64748b">读取/创建文档</text>
      
      <text x="0" y="80" font-family="'Consolas', monospace" font-size="12" fill="#475569">docx_summary()</text>
      <text x="140" y="80" font-family="Arial, sans-serif" font-size="12" fill="#64748b">查看文档结构</text>
      
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2b579a" transform="translate(0, 95)">内容添加</text>
      <rect x="0" y="123" width="360" height="1" fill="#e2e8f0" transform="translate(0, 0)"/>
      
      <text x="0" y="150" font-family="'Consolas', monospace" font-size="12" fill="#475569">body_add_par()</text>
      <text x="140" y="150" font-family="Arial, sans-serif" font-size="12" fill="#64748b">添加段落</text>
      
      <text x="0" y="175" font-family="'Consolas', monospace" font-size="12" fill="#475569">body_add_table()</text>
      <text x="140" y="175" font-family="Arial, sans-serif" font-size="12" fill="#64748b">插入表格</text>
      
      <text x="0" y="200" font-family="'Consolas', monospace" font-size="12" fill="#475569">body_add_gg()</text>
      <text x="140" y="200" font-family="Arial, sans-serif" font-size="12" fill="#64748b">插入ggplot图表</text>
      
      <text x="0" y="225" font-family="'Consolas', monospace" font-size="12" fill="#475569">body_add_img()</text>
      <text x="140" y="225" font-family="Arial, sans-serif" font-size="12" fill="#64748b">插入图片</text>
      
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2b579a" transform="translate(0, 240)">高级功能</text>
      <rect x="0" y="268" width="360" height="1" fill="#e2e8f0" transform="translate(0, 0)"/>
      
      <text x="0" y="295" font-family="'Consolas', monospace" font-size="12" fill="#475569">body_add_toc()</text>
      <text x="140" y="295" font-family="Arial, sans-serif" font-size="12" fill="#64748b">添加目录</text>
      
      <text x="0" y="320" font-family="'Consolas', monospace" font-size="12" fill="#475569">docx_bookmarks()</text>
      <text x="140" y="320" font-family="Arial, sans-serif" font-size="12" fill="#64748b">书签操作</text>
    </g>
  </g>
  
  <!-- PowerPoint 模块 -->
  <g transform="translate(500, 320)" filter="url(#shadow)">
    <!-- 卡片背景 -->
    <rect width="400" height="420" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- 顶部色块 -->
    <rect x="0" y="0" width="400" height="60" rx="12" fill="url(#pptGrad)"/>
    <rect x="0" y="45" width="400" height="15" fill="url(#pptGrad)"/>
    
    <!-- 图标 -->
    <rect x="20" y="15" width="35" height="35" rx="4" fill="white" opacity="0.2"/>
    <text x="37" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">P</text>
    <text x="70" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="white">PowerPoint</text>
    
    <!-- 功能列表 -->
    <g transform="translate(20, 80)">
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d24726">幻灯片管理</text>
      <rect x="0" y="28" width="360" height="1" fill="#e2e8f0"/>
      
      <text x="0" y="55" font-family="'Consolas', monospace" font-size="12" fill="#475569">read_pptx()</text>
      <text x="140" y="55" font-family="Arial, sans-serif" font-size="12" fill="#64748b">读取/创建演示文稿</text>
      
      <text x="0" y="80" font-family="'Consolas', monospace" font-size="12" fill="#475569">add_slide()</text>
      <text x="140" y="80" font-family="Arial, sans-serif" font-size="12" fill="#64748b">添加幻灯片</text>
      
      <text x="0" y="105" font-family="'Consolas', monospace" font-size="12" fill="#475569">slide_layouts()</text>
      <text x="140" y="105" font-family="Arial, sans-serif" font-size="12" fill="#64748b">查看可用版式</text>
      
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d24726" transform="translate(0, 120)">内容添加</text>
      <rect x="0" y="148" width="360" height="1" fill="#e2e8f0" transform="translate(0, 0)"/>
      
      <text x="0" y="175" font-family="'Consolas', monospace" font-size="12" fill="#475569">ph_with_text()</text>
      <text x="140" y="175" font-family="Arial, sans-serif" font-size="12" fill="#64748b">添加文本</text>
      
      <text x="0" y="200" font-family="'Consolas', monospace" font-size="12" fill="#475569">ph_with_table()</text>
      <text x="140" y="200" font-family="Arial, sans-serif" font-size="12" fill="#64748b">添加表格</text>
      
      <text x="0" y="225" font-family="'Consolas', monospace" font-size="12" fill="#475569">ph_with_gg()</text>
      <text x="140" y="225" font-family="Arial, sans-serif" font-size="12" fill="#64748b">添加ggplot图表</text>
      
      <text x="0" y="250" font-family="'Consolas', monospace" font-size="12" fill="#475569">ph_with_flextable()</text>
      <text x="170" y="250" font-family="Arial, sans-serif" font-size="12" fill="#64748b">美化表格</text>
    </g>
  </g>
  
  <!-- Excel 模块 -->
  <g transform="translate(950, 320)" filter="url(#shadow)">
    <!-- 卡片背景 -->
    <rect width="400" height="420" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- 顶部色块 -->
    <rect x="0" y="0" width="400" height="60" rx="12" fill="url(#excelGrad)"/>
    <rect x="0" y="45" width="400" height="15" fill="url(#excelGrad)"/>
    
    <!-- 图标 -->
    <rect x="20" y="15" width="35" height="35" rx="4" fill="white" opacity="0.2"/>
    <text x="37" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">X</text>
    <text x="70" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="white">Excel</text>
    
    <!-- 功能列表 -->
    <g transform="translate(20, 80)">
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#217346">基础操作</text>
      <rect x="0" y="28" width="360" height="1" fill="#e2e8f0"/>
      
      <text x="0" y="55" font-family="'Consolas', monospace" font-size="12" fill="#475569">read_xlsx()</text>
      <text x="140" y="55" font-family="Arial, sans-serif" font-size="12" fill="#64748b">读取Excel文件</text>
      
      <text x="0" y="80" font-family="'Consolas', monospace" font-size="12" fill="#475569">xl_book()</text>
      <text x="140" y="80" font-family="Arial, sans-serif" font-size="12" fill="#64748b">创建工作簿</text>
      
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#217346" transform="translate(0, 95)">数据操作</text>
      <rect x="0" y="123" width="360" height="1" fill="#e2e8f0" transform="translate(0, 0)"/>
      
      <text x="0" y="150" font-family="'Consolas', monospace" font-size="12" fill="#475569">xl_add_data()</text>
      <text x="140" y="150" font-family="Arial, sans-serif" font-size="12" fill="#64748b">添加数据到工作表</text>
      
      <text x="0" y="175" font-family="'Consolas', monospace" font-size="12" fill="#475569">xl_save()</text>
      <text x="140" y="175" font-family="Arial, sans-serif" font-size="12" fill="#64748b">保存工作簿</text>
      
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" transform="translate(0, 195)">⚠️ 推荐方案</text>
      <rect x="0" y="223" width="360" height="1" fill="#e2e8f0" transform="translate(0, 0)"/>
      
      <text x="0" y="250" font-family="Arial, sans-serif" font-size="12" fill="#475569">复杂Excel操作推荐结合</text>
      <text x="0" y="275" font-family="Arial, sans-serif" font-size="12" fill="#217346" font-weight="bold">openxlsx</text>
      <text x="75" y="275" font-family="Arial, sans-serif" font-size="12" fill="#475569">包使用</text>
      
      <rect x="0" y="295" width="360" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="320" font-family="Arial, sans-serif" font-size="11" fill="#92400e">openxlsx 提供更完整的</text>
      <text x="10" y="340" font-family="Arial, sans-serif" font-size="11" fill="#92400e">Excel格式化功能</text>
    </g>
  </g>
  
  <!-- 底部配套包 -->
  <g transform="translate(50, 760)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#475569">配套推荐包：</text>
    
    <rect x="130" y="-18" width="90" height="28" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
    <text x="175" y="2" font-family="'Consolas', monospace" font-size="12" text-anchor="middle" fill="#0369a1">flextable</text>
    
    <rect x="230" y="-18" width="70" height="28" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="265" y="2" font-family="'Consolas', monospace" font-size="12" text-anchor="middle" fill="#92400e">rvg</text>
    
    <rect x="310" y="-18" width="90" height="28" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="355" y="2" font-family="'Consolas', monospace" font-size="12" text-anchor="middle" fill="#15803d">openxlsx</text>
    
    <rect x="410" y="-18" width="80" height="28" rx="14" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
    <text x="450" y="2" font-family="'Consolas', monospace" font-size="12" text-anchor="middle" fill="#7c3aed">mschart</text>
    
    <text x="510" y="2" font-family="Arial, sans-serif" font-size="12" fill="#64748b">等</text>
  </g>
  
  <!-- 底部说明 -->
  <text x="1300" y="780" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#94a3b8">officer v0.6+ | David Gohel</text>
</svg>
