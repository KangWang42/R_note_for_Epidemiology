<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wordGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b579a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3d6d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pptGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d24726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a33a1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="excelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#217346;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#165534;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- 装饰性网格线 -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="600" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- 左侧 Office 图标组 -->
  <g transform="translate(150, 180)" filter="url(#shadow)">
    <!-- Word 图标 -->
    <rect x="0" y="0" width="100" height="120" rx="8" fill="url(#wordGradient)"/>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="50" font-weight="bold" text-anchor="middle" fill="white">W</text>
    <line x1="20" y1="85" x2="80" y2="85" stroke="white" stroke-width="3" opacity="0.5"/>
    <line x1="20" y1="95" x2="60" y2="95" stroke="white" stroke-width="3" opacity="0.3"/>
    
    <!-- PowerPoint 图标 -->
    <rect x="120" y="20" width="100" height="120" rx="8" fill="url(#pptGradient)"/>
    <text x="170" y="90" font-family="Arial, sans-serif" font-size="50" font-weight="bold" text-anchor="middle" fill="white">P</text>
    <circle cx="170" cy="50" r="15" fill="white" opacity="0.3"/>
    
    <!-- Excel 图标 -->
    <rect x="60" y="140" width="100" height="120" rx="8" fill="url(#excelGradient)"/>
    <text x="110" y="210" font-family="Arial, sans-serif" font-size="50" font-weight="bold" text-anchor="middle" fill="white">X</text>
    <rect x="25" y="170" width="25" height="8" fill="white" opacity="0.4"/>
    <rect x="25" y="185" width="35" height="8" fill="white" opacity="0.3"/>
    <rect x="25" y="200" width="20" height="8" fill="white" opacity="0.5"/>
  </g>
  
  <!-- 中央 officer 标题 -->
  <g transform="translate(600, 250)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="white" letter-spacing="2">officer</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#64b5f6" letter-spacing="3">R语言操作Office文档的终极解决方案</text>
  </g>
  
  <!-- 右侧功能标签 -->
  <g transform="translate(850, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="rgba(255,255,255,0.15)"/>
    <text x="90" y="27" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">📄 Word自动化</text>
    
    <rect x="0" y="60" width="180" height="40" rx="20" fill="rgba(255,255,255,0.15)"/>
    <text x="90" y="87" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">📊 PPT演示文稿</text>
    
    <rect x="0" y="120" width="180" height="40" rx="20" fill="rgba(255,255,255,0.15)"/>
    <text x="90" y="147" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">📈 Excel数据处理</text>
    
    <rect x="0" y="180" width="180" height="40" rx="20" fill="rgba(255,255,255,0.15)"/>
    <text x="90" y="207" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">⚡ 批量报告生成</text>
  </g>
  
  <!-- 底部代码示例 -->
  <g transform="translate(600, 450)">
    <rect x="-250" y="0" width="500" height="70" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="-235" y="25" font-family="'Consolas', monospace" font-size="13" fill="#9cdcfe">doc</text>
    <text x="-205" y="25" font-family="'Consolas', monospace" font-size="13" fill="#d4d4d4">&lt;-</text>
    <text x="-175" y="25" font-family="'Consolas', monospace" font-size="13" fill="#dcdcaa">read_docx</text>
    <text x="-85" y="25" font-family="'Consolas', monospace" font-size="13" fill="#d4d4d4">() %&gt;%</text>
    <text x="-235" y="45" font-family="'Consolas', monospace" font-size="13" fill="#dcdcaa">body_add_par</text>
    <text x="-115" y="45" font-family="'Consolas', monospace" font-size="13" fill="#d4d4d4">(</text>
    <text x="-105" y="45" font-family="'Consolas', monospace" font-size="13" fill="#ce9178">"自动化报告"</text>
    <text x="15" y="45" font-family="'Consolas', monospace" font-size="13" fill="#d4d4d4">) %&gt;%</text>
    <text x="-235" y="65" font-family="'Consolas', monospace" font-size="13" fill="#dcdcaa">body_add_table</text>
    <text x="-95" y="65" font-family="'Consolas', monospace" font-size="13" fill="#d4d4d4">(data)</text>
  </g>
  
  <!-- 底部信息 -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8ba3be">R Package Tutorial | Document Automation</text>
</svg>
