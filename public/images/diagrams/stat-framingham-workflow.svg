<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="#ffffff"/>

  <text x="700" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
    Logistic 回归到 Framingham 评分系统的完整流程
  </text>

  <g transform="translate(70,120)">
    <rect width="240" height="110" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="120" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">步骤 1</text>
    <text x="120" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">变量分层</text>
    <text x="120" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">年龄/血压/血脂分段</text>
  </g>

  <g transform="translate(390,120)">
    <rect width="240" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="120" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14532d">步骤 2</text>
    <text x="120" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">拟合 Logistic</text>
    <text x="120" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">提取回归系数 beta</text>
  </g>

  <g transform="translate(710,120)">
    <rect width="240" height="110" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="120" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">步骤 3</text>
    <text x="120" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">系数缩放</text>
    <text x="120" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">积分 = round(beta / B)</text>
  </g>

  <g transform="translate(1030,120)">
    <rect width="300" height="110" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="150" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7f1d1d">步骤 4</text>
    <text x="150" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">构建积分卡</text>
    <text x="150" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">每个水平对应整数分值</text>
  </g>

  <path d="M 310 175 L 385 175" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 630 175 L 705 175" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 950 175 L 1025 175" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(120,350)">
    <rect width="360" height="140" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="180" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#312e81">步骤 5</text>
    <text x="180" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">个体总分计算</text>
    <text x="180" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">总分 = 各风险因子积分之和</text>
  </g>

  <g transform="translate(530,350)">
    <rect width="360" height="140" rx="16" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
    <text x="180" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#155e75">步骤 6</text>
    <text x="180" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">总分映射风险</text>
    <text x="180" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">桥接到 10 年事件概率</text>
  </g>

  <g transform="translate(940,350)">
    <rect width="340" height="140" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
    <text x="170" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#831843">步骤 7</text>
    <text x="170" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">风险分层</text>
    <text x="170" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">低风险/中风险/高风险</text>
  </g>

  <path d="M 1180 230 L 1180 342" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 480 420 L 522 420" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 890 420 L 932 420" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(250,560)">
    <rect width="430" height="165" rx="18" fill="#ecfeff" stroke="#0e7490" stroke-width="3"/>
    <text x="215" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#164e63">步骤 8：性能验证</text>
    <text x="44" y="86" font-family="Arial, sans-serif" font-size="18" fill="#334155">- 区分度：AUC / ROC</text>
    <text x="44" y="116" font-family="Arial, sans-serif" font-size="18" fill="#334155">- 校准度：校准图、斜率</text>
    <text x="44" y="146" font-family="Arial, sans-serif" font-size="18" fill="#334155">- 临床可用性：风险分层覆盖率</text>
  </g>

  <g transform="translate(730,560)">
    <rect width="430" height="165" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="215" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#14532d">步骤 9：临床落地</text>
    <text x="44" y="86" font-family="Arial, sans-serif" font-size="18" fill="#334155">- 发布积分查询表</text>
    <text x="44" y="116" font-family="Arial, sans-serif" font-size="18" fill="#334155">- 门诊宣教与分诊流程</text>
    <text x="44" y="146" font-family="Arial, sans-serif" font-size="18" fill="#334155">- 外部队列持续再校准</text>
  </g>

  <path d="M 510 560 L 510 500" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1010 560 L 1010 500" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
