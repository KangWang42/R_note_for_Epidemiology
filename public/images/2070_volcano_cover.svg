    <path d="M620 480 C640 420, 660 320, 680 240 C700 320, 720 420, 740 480 Z" fill="url(#lava)" opacity="0.95"/>
    <path d="M655 235 C665 210, 675 170, 680 140 C685 170, 695 210, 705 235 Z" fill="#fbbf24" opacity="0.95"/>

    <text x="140" y="95" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="56" font-weight="700">火山图（Volcano Plot）完全教程</text>
    <text x="140" y="140" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28">差异分析可视化 · 阈值策略 · 重点标注 · 多对比分面</text>
