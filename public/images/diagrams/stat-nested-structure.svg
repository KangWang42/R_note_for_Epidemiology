<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7fafc"/>
      <stop offset="100%" style="stop-color:#edf2f7"/>
    </linearGradient>
    <linearGradient id="level3Box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fed7e2"/>
      <stop offset="100%" style="stop-color:#fbb6ce"/>
    </linearGradient>
    <linearGradient id="level2Box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c6f6d5"/>
      <stop offset="100%" style="stop-color:#9ae6b4"/>
    </linearGradient>
    <linearGradient id="level1Box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#bee3f8"/>
      <stop offset="100%" style="stop-color:#90cdf4"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="800" fill="url(#bgGrad)"/>

  <!-- 标题 -->
  <text x="700" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2d3748">
    嵌套数据结构示意图
  </text>
  <text x="700" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#718096">
    Three-Level Nested Data Structure: Students → Schools → Regions
  </text>

  <!-- ==================== 左侧：层次结构图 ==================== -->
  <g transform="translate(50, 120)">
    <!-- 标题 -->
    <text x="300" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4a5568">
      数据层次结构
    </text>

    <!-- Level 3: 地区 -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="600" height="580" rx="20" fill="none" stroke="#f687b3" stroke-width="4" stroke-dasharray="8,4"/>
      <rect x="20" y="-25" width="120" height="40" rx="20" fill="url(#level3Box)" stroke="#f687b3" stroke-width="2"/>
      <text x="80" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#742a2a">Level 3: 地区</text>
      <text x="500" y="20" font-family="Arial, sans-serif" font-size="14" fill="#e53e3e">地区特征：GDP、人口密度</text>

      <!-- Level 3 说明 -->
      <g transform="translate(20, 520)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#744210">• 样本量：J = 10 个地区</text>
        <text x="0" y="20" font-family="Arial, sans-serif" font-size="13" fill="#744210">• 随机效应：u₀ⱼ ~ N(0, σ²ᵤ)</text>
        <text x="0" y="40" font-family="Arial, sans-serif" font-size="13" fill="#744210">• 解释地区间变异</text>
      </g>

      <!-- Level 2: 学校 A -->
      <g transform="translate(40, 70)">
        <rect x="0" y="0" width="250" height="420" rx="15" fill="none" stroke="#68d391" stroke-width="3"/>
        <rect x="15" y="-20" width="100" height="35" rx="17" fill="url(#level2Box)" stroke="#68d391" stroke-width="2"/>
        <text x="65" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22543d">学校 A</text>
        <text x="180" y="15" font-family="Arial, sans-serif" font-size="12" fill="#38a169">学校类型、师资</text>

        <!-- Level 2 说明 -->
        <g transform="translate(15, 360)">
          <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#22543d">n = 30 名学生</text>
          <text x="0" y="15" font-family="Arial, sans-serif" font-size="11" fill="#22543d">u₀ⱼ = +2.5</text>
        </g>

        <!-- Level 1: 学生 -->
        <g transform="translate(25, 50)">
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 1</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习3h, 成绩75</text>
          </g>
          <g transform="translate(110, 0)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 2</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习4h, 成绩82</text>
          </g>

          <g transform="translate(0, 60)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 3</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习2h, 成绩68</text>
          </g>
          <g transform="translate(110, 60)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 4</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习5h, 成绩88</text>
          </g>

          <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#718096">...</text>

          <g transform="translate(0, 150)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 29</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习3h, 成绩76</text>
          </g>
          <g transform="translate(110, 150)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 30</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习4h, 成绩85</text>
          </g>
        </g>
      </g>

      <!-- Level 2: 学校 B -->
      <g transform="translate(310, 70)">
        <rect x="0" y="0" width="250" height="420" rx="15" fill="none" stroke="#68d391" stroke-width="3"/>
        <rect x="15" y="-20" width="100" height="35" rx="17" fill="url(#level2Box)" stroke="#68d391" stroke-width="2"/>
        <text x="65" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22543d">学校 B</text>
        <text x="180" y="15" font-family="Arial, sans-serif" font-size="12" fill="#38a169">学校类型、师资</text>

        <!-- Level 2 说明 -->
        <g transform="translate(15, 360)">
          <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#22543d">n = 25 名学生</text>
          <text x="0" y="15" font-family="Arial, sans-serif" font-size="11" fill="#22543d">u₀ⱼ = -1.8</text>
        </g>

        <!-- Level 1: 学生 -->
        <g transform="translate(25, 50)">
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 31</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习3h, 成绩70</text>
          </g>
          <g transform="translate(110, 0)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 32</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习4h, 成绩78</text>
          </g>

          <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#718096">...</text>

          <g transform="translate(0, 100)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 54</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习2h, 成绩65</text>
          </g>
          <g transform="translate(110, 100)">
            <rect x="0" y="0" width="90" height="40" rx="8" fill="url(#level1Box)" stroke="#4299e1" stroke-width="1.5"/>
            <text x="45" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b6cb0">学生 55</text>
            <text x="45" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">学习5h, 成绩82</text>
          </g>
        </g>
      </g>

      <!-- 更多学校提示 -->
      <text x="300" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#718096">... 更多学校 (共 40 所)</text>
    </g>

    <!-- Level 1 说明 -->
    <g transform="translate(20, 620)">
      <rect x="0" y="0" width="560" height="50" rx="10" fill="rgba(190,227,248,0.3)" stroke="#4299e1" stroke-width="1"/>
      <text x="280" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2b6cb0">Level 1: 学生层面 (i)</text>
      <text x="280" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">个体特征：学习时长、性别、SES | 总样本：N = 1,200 | 残差：εᵢⱼ ~ N(0, σ²)</text>
    </g>
  </g>

  <!-- ==================== 右侧：模型公式与解释 ==================== -->
  <g transform="translate(720, 120)">
    <!-- 标题 -->
    <text x="315" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4a5568">
      模型公式分解
    </text>

    <!-- 合并模型 -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="630" height="100" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
      <text x="20" y="30" font-family="Times New Roman, serif" font-size="16" font-weight="bold" fill="#2d3748">合并模型 (Combined Model)</text>
      <text x="20" y="65" font-family="Times New Roman, serif" font-size="18" fill="#4a5568">
        Y&lt;sub&gt;ij&lt;/sub&gt; = β&lt;sub&gt;0&lt;/sub&gt; + β&lt;sub&gt;1&lt;/sub&gt;X&lt;sub&gt;ij&lt;/sub&gt; + u&lt;sub&gt;0j&lt;/sub&gt; + ε&lt;sub&gt;ij&lt;/sub&gt;
      </text>
      <text x="20" y="88" font-family="Arial, sans-serif" font-size="11" fill="#718096">i = 学生索引, j = 学校索引 | u₀ⱼ: 学校随机截距, εᵢⱼ: 个体残差</text>
    </g>

    <!-- 分层分解 -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a5568">分层表示</text>

      <!-- Level 1 -->
      <g transform="translate(0, 25)">
        <rect x="0" y="0" width="630" height="80" rx="8" fill="url(#level1Box)" opacity="0.5" stroke="#4299e1" stroke-width="1.5"/>
        <text x="15" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2b6cb0">Level 1 (学生层面):</text>
        <text x="180" y="25" font-family="Times New Roman, serif" font-size="14" fill="#2d3748">Y&lt;sub&gt;ij&lt;/sub&gt; = β&lt;sub&gt;0j&lt;/sub&gt; + β&lt;sub&gt;1&lt;/sub&gt;X&lt;sub&gt;ij&lt;/sub&gt; + ε&lt;sub&gt;ij&lt;/sub&gt;</text>
        <text x="15" y="50" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">• β₀ⱼ: 学校j的截距 (各校平均成绩不同)</text>
        <text x="15" y="68" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">• β₁: 学习时长的效应 (假设各校相同)</text>
      </g>

      <!-- Level 2 -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="630" height="100" rx="8" fill="url(#level2Box)" opacity="0.5" stroke="#68d391" stroke-width="1.5"/>
        <text x="15" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#22543d">Level 2 (学校层面):</text>
        <text x="180" y="25" font-family="Times New Roman, serif" font-size="14" fill="#2d3748">β&lt;sub&gt;0j&lt;/sub&gt; = γ&lt;sub&gt;00&lt;/sub&gt; + γ&lt;sub&gt;01&lt;/sub&gt;W&lt;sub&gt;j&lt;/sub&gt; + u&lt;sub&gt;0j&lt;/sub&gt;</text>
        <text x="15" y="50" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">• γ₀₀: 总体平均截距</text>
        <text x="15" y="68" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">• γ₀₁: 学校层面变量W的效应 (如学校类型)</text>
        <text x="15" y="86" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">• u₀ⱼ: 学校随机效应, u₀ⱼ ~ N(0, σ²ᵤ)</text>
      </g>
    </g>

    <!-- 方差分解 -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a5568">方差分解与ICC</text>

      <rect x="0" y="15" width="630" height="140" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- 公式 -->
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="13" fill="#2d3748">总方差 = 组间方差 + 组内方差</text>
      <text x="20" y="75" font-family="Times New Roman, serif" font-size="15" fill="#4a5568">Var(Y) = σ²ᵤ + σ²</text>

      <text x="300" y="50" font-family="Arial, sans-serif" font-size="13" fill="#2d3748">组内相关系数 (ICC)</text>
      <text x="300" y="75" font-family="Times New Roman, serif" font-size="15" fill="#4a5568">ICC = σ²ᵤ / (σ²ᵤ + σ²)</text>

      <!-- 解释 -->
      <text x="20" y="110" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">σ²ᵤ = 学校间方差 (随机截距方差)</text>
      <text x="20" y="130" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">σ² = 学校内方差 (残差方差)</text>
      <text x="300" y="120" font-family="Arial, sans-serif" font-size="11" fill="#744210">ICC表示：成绩变异中，由于学校不同造成的比例</text>
    </g>

    <!-- 随机效应示意图 -->
    <g transform="translate(0, 480)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a5568">随机效应可视化</text>

      <rect x="0" y="15" width="630" height="200" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- 坐标轴 -->
      <line x1="50" y1="180" x2="580" y2="180" stroke="#4a5568" stroke-width="2"/>
      <line x1="50" y1="180" x2="50" y2="40" stroke="#4a5568" stroke-width="2"/>
      <text x="580" y="195" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">学习时长 X</text>
      <text x="30" y="110" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" transform="rotate(-90, 30, 110)">成绩 Y</text>

      <!-- 总体回归线 -->
      <line x1="70" y1="160" x2="560" y2="60" stroke="#4a5568" stroke-width="3" stroke-dasharray="5,3"/>
      <text x="480" y="55" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">总体回归线 (固定效应)</text>

      <!-- 学校A的回归线 (高截距) -->
      <line x1="70" y1="130" x2="560" y2="30" stroke="#f687b3" stroke-width="2.5"/>
      <circle cx="70" cy="130" r="6" fill="#f687b3"/>
      <text x="75" y="125" font-family="Arial, sans-serif" font-size="10" fill="#742a2a">学校A (u₀ⱼ &gt; 0)</text>

      <!-- 学校B的回归线 (低截距) -->
      <line x1="70" y1="170" x2="560" y2="70" stroke="#68d391" stroke-width="2.5"/>
      <circle cx="70" cy="170" r="6" fill="#68d391"/>
      <text x="75" y="190" font-family="Arial, sans-serif" font-size="10" fill="#22543d">学校B (u₀ⱼ &lt; 0)</text>

      <!-- 说明 -->
      <text x="320" y="150" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">每条线代表一所学校的</text>
      <text x="320" y="165" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">回归方程，截距不同</text>
      <text x="320" y="180" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">但斜率相同</text>
    </g>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="1300" height="40" rx="8" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
    <text x="650" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4a5568">
      <tspan font-weight="bold">关键要点：</tspan>嵌套回归模型允许不同学校有不同的平均成绩（随机截距），同时估计学习时长对成绩的总体效应（固定斜率）
    </text>
  </g>
</svg>