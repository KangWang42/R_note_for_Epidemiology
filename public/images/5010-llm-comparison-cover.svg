<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
    
    <!-- 网格图案 -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    
    <!-- 卡片渐变 -->
    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cardGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cardGradient4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cardGradient5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cardGradient6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- 装饰性圆环 -->
  <circle cx="100" cy="100" r="200" fill="none" stroke="rgba(99,102,241,0.2)" stroke-width="2"/>
  <circle cx="1100" cy="530" r="250" fill="none" stroke="rgba(139,92,246,0.15)" stroke-width="2"/>
  
  <!-- 模型卡片 -->
  <!-- Kimi -->
  <rect x="80" y="120" width="160" height="100" rx="12" fill="url(#cardGradient1)"/>
  <text x="160" y="165" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Kimi</text>
  <text x="160" y="195" fill="rgba(255,255,255,0.8)" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle">Moonshot AI</text>
  
  <!-- DeepSeek -->
  <rect x="260" y="120" width="160" height="100" rx="12" fill="url(#cardGradient2)"/>
  <text x="340" y="165" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">DeepSeek</text>
  <text x="340" y="195" fill="rgba(255,255,255,0.8)" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle">深度求索</text>
  
  <!-- GLM -->
  <rect x="440" y="120" width="160" height="100" rx="12" fill="url(#cardGradient3)"/>
  <text x="520" y="165" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">GLM</text>
  <text x="520" y="195" fill="rgba(255,255,255,0.8)" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle">智谱 AI</text>
  
  <!-- Gemini -->
  <rect x="620" y="120" width="160" height="100" rx="12" fill="url(#cardGradient4)"/>
  <text x="700" y="165" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">Gemini</text>
  <text x="700" y="195" fill="rgba(255,255,255,0.8)" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle">Google</text>
  
  <!-- Claude -->
  <rect x="800" y="120" width="160" height="100" rx="12" fill="url(#cardGradient5)"/>
  <text x="880" y="165" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">Claude</text>
  <text x="880" y="195" fill="rgba(255,255,255,0.8)" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle">Anthropic</text>
  
  <!-- GPT-5 -->
  <rect x="980" y="120" width="140" height="100" rx="12" fill="url(#cardGradient6)"/>
  <text x="1050" y="165" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">GPT-5</text>
  <text x="1050" y="195" fill="rgba(255,255,255,0.8)" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle">OpenAI</text>
  
  <!-- 连接线装饰 -->
  <line x1="160" y1="220" x2="160" y2="280" stroke="rgba(99,102,241,0.4)" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="340" y1="220" x2="340" y2="280" stroke="rgba(139,92,246,0.4)" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="520" y1="220" x2="520" y2="280" stroke="rgba(236,72,153,0.4)" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="700" y1="220" x2="700" y2="280" stroke="rgba(245,158,11,0.4)" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="880" y1="220" x2="880" y2="280" stroke="rgba(16,185,129,0.4)" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="1050" y1="220" x2="1050" y2="280" stroke="rgba(6,182,212,0.4)" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- 对比表格示意 -->
  <rect x="150" y="280" width="900" height="180" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- 表头 -->
  <rect x="170" y="300" width="860" height="40" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="220" y="325" fill="rgba(255,255,255,0.9)" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold">模型</text>
  <text x="400" y="325" fill="rgba(255,255,255,0.9)" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold">输入价格</text>
  <text x="580" y="325" fill="rgba(255,255,255,0.9)" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold">输出价格</text>
  <text x="760" y="325" fill="rgba(255,255,255,0.9)" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold">上下文</text>
  <text x="940" y="325" fill="rgba(255,255,255,0.9)" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold">特点</text>
  
  <!-- 数据行1 -->
  <text x="220" y="365" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">DeepSeek</text>
  <text x="400" y="365" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">$0.07/M</text>
  <text x="580" y="365" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">$0.40/M</text>
  <text x="760" y="365" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">128K</text>
  <text x="940" y="365" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">极致性价比</text>
  
  <!-- 数据行2 -->
  <text x="220" y="400" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">Claude</text>
  <text x="400" y="400" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">$3.00/M</text>
  <text x="580" y="400" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">$15.00/M</text>
  <text x="760" y="400" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">200K</text>
  <text x="940" y="400" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">代码最强</text>
  
  <!-- 数据行3 -->
  <text x="220" y="435" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">GPT-5</text>
  <text x="400" y="435" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">$0.875/M</text>
  <text x="580" y="435" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">$7.00/M</text>
  <text x="760" y="435" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">128K</text>
  <text x="940" y="435" fill="rgba(255,255,255,0.7)" font-family="'Segoe UI', Arial, sans-serif" font-size="14">Agent 王者</text>
  
  <!-- 主标题 -->
  <text x="600" y="530" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle">主流大语言模型 API 选型指南</text>
  
  <!-- 副标题 -->
  <text x="600" y="575" fill="rgba(255,255,255,0.8)" font-family="'Segoe UI', Arial, sans-serif" font-size="24" text-anchor="middle">Kimi · DeepSeek · GLM · Gemini · Claude · GPT-5 横向对比</text>
  
  <!-- API 标签 -->
  <rect x="520" y="52" width="160" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="600" y="76" fill="rgba(255,255,255,0.9)" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">API 定价对比</text>
</svg>