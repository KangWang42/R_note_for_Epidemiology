<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="OpenAI subscription guide cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1f3a5f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="140" r="220" fill="#66c2ff" fill-opacity="0.15"/>
  <circle cx="210" cy="760" r="260" fill="#6ef3d6" fill-opacity="0.12"/>
  <rect x="120" y="120" rx="28" ry="28" width="1360" height="660" fill="url(#card)" stroke="#d9efff" stroke-opacity="0.35"/>

  <text x="180" y="255" fill="#e8f4ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="62" font-weight="700">
    OpenAI 购买与使用教程
  </text>
  <text x="180" y="335" fill="#b8ddff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="40" font-weight="500">
    Go / Plus / Pro · Codex · 降智挽救 · 链式代理
  </text>

  <g transform="translate(180,420)">
    <rect width="360" height="110" rx="18" fill="#0f2238" stroke="#73c7ff" stroke-opacity="0.7"/>
    <text x="30" y="50" fill="#cfe9ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700">订阅对比</text>
    <text x="30" y="86" fill="#9dd3ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22">Go / Plus / Pro</text>
  </g>

  <g transform="translate(580,420)">
    <rect width="360" height="110" rx="18" fill="#0f2238" stroke="#6ef3d6" stroke-opacity="0.7"/>
    <text x="30" y="50" fill="#d9fff6" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700">Codex 差异</text>
    <text x="30" y="86" fill="#9ff3e4" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22">本地协作 / 云端委托</text>
  </g>

  <g transform="translate(980,420)">
    <rect width="420" height="110" rx="18" fill="#0f2238" stroke="#ffd48b" stroke-opacity="0.7"/>
    <text x="30" y="50" fill="#ffe7bf" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="700">稳定性与合规</text>
    <text x="30" y="86" fill="#ffd79e" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22">降智挽救 / 家宽节点检查</text>
  </g>

  <text x="180" y="710" fill="#d9ebff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" font-weight="500">
    R 语言学习笔记 · AI 工具专题
  </text>
</svg>
