<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1060" cy="90" r="95" fill="#ffffff" opacity="0.08"/>
  <circle cx="120" cy="560" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="1040" cy="540" r="60" fill="#ffffff" opacity="0.07"/>

  <g transform="translate(80,120)">
    <rect x="0" y="0" width="460" height="360" rx="18" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>
    <text x="230" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Framingham 风险积分卡</text>
    <text x="50" y="92" font-family="Arial, sans-serif" font-size="18" fill="#334155">年龄 60-64</text>
    <text x="410" y="92" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">+6</text>

    <text x="50" y="132" font-family="Arial, sans-serif" font-size="18" fill="#334155">收缩压 140-159</text>
    <text x="410" y="132" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">+4</text>

    <text x="50" y="172" font-family="Arial, sans-serif" font-size="18" fill="#334155">总胆固醇 200-239</text>
    <text x="410" y="172" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">+2</text>

    <text x="50" y="212" font-family="Arial, sans-serif" font-size="18" fill="#334155">HDL 40-49</text>
    <text x="410" y="212" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">+1</text>

    <text x="50" y="252" font-family="Arial, sans-serif" font-size="18" fill="#334155">吸烟 是</text>
    <text x="410" y="252" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">+3</text>

    <line x1="40" y1="282" x2="420" y2="282" stroke="#cbd5e1" stroke-width="2"/>

    <text x="50" y="325" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">总分</text>
    <text x="410" y="325" text-anchor="end" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#1d4ed8">16</text>
  </g>

  <g transform="translate(610,150)">
    <rect x="0" y="0" width="510" height="320" rx="20" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>
    <text x="255" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">总分映射 10 年风险</text>

    <polyline points="60,245 130,218 200,188 270,156 340,128 410,105 460,88"
      fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="60" y1="245" x2="460" y2="245" stroke="#94a3b8" stroke-width="2"/>
    <line x1="60" y1="245" x2="60" y2="80" stroke="#94a3b8" stroke-width="2"/>

    <text x="460" y="268" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="#334155">总分</text>
    <text x="30" y="90" transform="rotate(-90 30 90)" font-family="Arial, sans-serif" font-size="16" fill="#334155">风险概率</text>

    <circle cx="270" cy="156" r="8" fill="#1d4ed8"/>
    <text x="286" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">16 分 ≈ 18.7%</text>
  </g>

  <text x="80" y="560" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">逻辑回归后应用 Framingham 评分系统</text>
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="25" fill="#e2e8f0">从回归系数到临床可执行风险分层</text>
</svg>
