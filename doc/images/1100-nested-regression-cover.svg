<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="50%" style="stop-color:#2c5282"/>
      <stop offset="100%" style="stop-color:#3182ce"/>
    </linearGradient>
    <!-- 节点渐变 -->
    <radialGradient id="level3Grad" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#fed7e2"/>
      <stop offset="100%" style="stop-color:#f687b3"/>
    </radialGradient>
    <radialGradient id="level2Grad" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#c6f6d5"/>
      <stop offset="100%" style="stop-color:#68d391"/>
    </radialGradient>
    <radialGradient id="level1Grad" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#bee3f8"/>
      <stop offset="100%" style="stop-color:#4299e1"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- 装饰性网格线 -->
  <g opacity="0.1">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="white" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="1"/>
    <line x1="0" y1="472" x2="1200" y2="472" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- 嵌套结构可视化 - 左侧 -->
  <g transform="translate(80, 150)">
    <!-- Level 3: 地区 -->
    <rect x="0" y="0" width="200" height="330" rx="15" fill="none" stroke="#f687b3" stroke-width="3" opacity="0.6"/>
    <circle cx="100" cy="-30" r="25" fill="url(#level3Grad)"/>
    <text x="100" y="-26" text-anchor="middle" font-size="14" font-weight="bold" fill="#742a2a">地区</text>

    <!-- Level 2: 学校 -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="160" height="120" rx="10" fill="none" stroke="#68d391" stroke-width="2.5" opacity="0.7"/>
      <circle cx="80" cy="-15" r="20" fill="url(#level2Grad)"/>
      <text x="80" y="-11" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">学校 A</text>

      <!-- Level 1: 学生 -->
      <circle cx="40" cy="35" r="18" fill="url(#level1Grad)"/>
      <circle cx="80" cy="65" r="18" fill="url(#level1Grad)"/>
      <circle cx="120" cy="35" r="18" fill="url(#level1Grad)"/>
      <text x="40" y="39" text-anchor="middle" font-size="10" fill="#2b6cb0">学1</text>
      <text x="80" y="69" text-anchor="middle" font-size="10" fill="#2b6cb0">学2</text>
      <text x="120" y="39" text-anchor="middle" font-size="10" fill="#2b6cb0">学3</text>
    </g>

    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="160" height="120" rx="10" fill="none" stroke="#68d391" stroke-width="2.5" opacity="0.7"/>
      <circle cx="80" cy="-15" r="20" fill="url(#level2Grad)"/>
      <text x="80" y="-11" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">学校 B</text>

      <!-- Level 1: 学生 -->
      <circle cx="40" cy="35" r="18" fill="url(#level1Grad)"/>
      <circle cx="80" cy="65" r="18" fill="url(#level1Grad)"/>
      <circle cx="120" cy="35" r="18" fill="url(#level1Grad)"/>
      <text x="40" y="39" text-anchor="middle" font-size="10" fill="#2b6cb0">学4</text>
      <text x="80" y="69" text-anchor="middle" font-size="10" fill="#2b6cb0">学5</text>
      <text x="120" y="39" text-anchor="middle" font-size="10" fill="#2b6cb0">学6</text>
    </g>
  </g>

  <!-- 连接线示意图 -->
  <g transform="translate(350, 200)">
    <!-- 三条回归线 -->
    <path d="M 0 150 L 200 50" stroke="#f687b3" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 0 180 L 200 80" stroke="#68d391" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 0 210 L 200 110" stroke="#4299e1" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- 散点 -->
    <circle cx="30" cy="120" r="5" fill="#f687b3"/>
    <circle cx="50" cy="100" r="5" fill="#f687b3"/>
    <circle cx="80" cy="90" r="5" fill="#f687b3"/>
    <circle cx="120" cy="70" r="5" fill="#f687b3"/>

    <circle cx="40" cy="155" r="5" fill="#68d391"/>
    <circle cx="70" cy="130" r="5" fill="#68d391"/>
    <circle cx="100" cy="115" r="5" fill="#68d391"/>
    <circle cx="140" cy="95" r="5" fill="#68d391"/>

    <circle cx="50" cy="190" r="5" fill="#4299e1"/>
    <circle cx="80" cy="165" r="5" fill="#4299e1"/>
    <circle cx="110" cy="145" r="5" fill="#4299e1"/>
    <circle cx="160" cy="120" r="5" fill="#4299e1"/>

    <!-- 坐标轴 -->
    <line x1="0" y1="230" x2="220" y2="230" stroke="white" stroke-width="2"/>
    <line x1="0" y1="230" x2="0" y2="20" stroke="white" stroke-width="2"/>
    <text x="110" y="255" text-anchor="middle" font-size="14" fill="white">预测变量 X</text>
    <text x="-30" y="130" text-anchor="middle" font-size="14" fill="white" transform="rotate(-90, -30, 130)">结果变量 Y</text>
  </g>

  <!-- 标题区域 -->
  <g transform="translate(620, 180)">
    <!-- 主标题 -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">
      嵌套回归模型
    </text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="32" fill="#bee3f8">
      多层线性模型 / 混合效应模型
    </text>

    <!-- 副标题 -->
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="20" fill="#e2e8f0">
      Hierarchical Linear Model (HLM) / Mixed Effects Model
    </text>

    <!-- 关键词标签 -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="90" height="32" rx="16" fill="rgba(246,135,179,0.3)" stroke="#f687b3" stroke-width="1"/>
      <text x="45" y="22" text-anchor="middle" font-size="13" fill="#fed7e2">随机效应</text>

      <rect x="105" y="0" width="90" height="32" rx="16" fill="rgba(104,211,145,0.3)" stroke="#68d391" stroke-width="1"/>
      <text x="150" y="22" text-anchor="middle" font-size="13" fill="#c6f6d5">组内相关</text>

      <rect x="210" y="0" width="90" height="32" rx="16" fill="rgba(66,153,225,0.3)" stroke="#4299e1" stroke-width="1"/>
      <text x="255" y="22" text-anchor="middle" font-size="13" fill="#bee3f8">跨层交互</text>

      <rect x="315" y="0" width="90" height="32" rx="16" fill="rgba(237,137,54,0.3)" stroke="#ed8936" stroke-width="1"/>
      <text x="360" y="22" text-anchor="middle" font-size="13" fill="#feebc8">lme4</text>
    </g>
  </g>

  <!-- 底部信息 -->
  <g transform="translate(620, 520)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" fill="#a0aec0">
      适用于：学生→班级→学校 | 患者→医院→地区 | 重复测量→个体
    </text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="14" fill="#718096">
      R语言统计分析教程系列
    </text>
  </g>

  <!-- 右下角装饰公式 -->
  <g transform="translate(950, 450)" opacity="0.15">
    <text x="0" y="0" font-family="Times New Roman, serif" font-size="24" fill="white" font-style="italic">
      Y&lt;sub&gt;ij&lt;/sub&gt; = β&lt;sub&gt;0&lt;/sub&gt; + β&lt;sub&gt;1&lt;/sub&gt;X&lt;sub&gt;ij&lt;/sub&gt; + u&lt;sub&gt;0j&lt;/sub&gt; + ε&lt;sub&gt;ij&lt;/sub&gt;
    </text>
  </g>
</svg>