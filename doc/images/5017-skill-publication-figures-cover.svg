<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/><stop offset="100%" style="stop-color:#7209b7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- mini scatter -->
  <g>
    <rect x="30" y="50" width="100" height="80" rx="4" fill="#ffffff" opacity="0.06"/>
    <circle cx="50" cy="115" r="3" fill="#e63946"/><circle cx="65" cy="100" r="3" fill="#e63946"/>
    <circle cx="80" cy="90" r="3" fill="#457b9d"/><circle cx="95" cy="75" r="3" fill="#457b9d"/>
    <circle cx="110" cy="65" r="3" fill="#2a9d8f"/>
    <line x1="40" y1="120" x2="120" y2="62" stroke="#f1faee" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- mini bars -->
  <g>
    <rect x="150" y="50" width="100" height="80" rx="4" fill="#ffffff" opacity="0.06"/>
    <rect x="160" y="95" width="14" height="30" fill="#f4a261"/><rect x="180" y="80" width="14" height="45" fill="#e76f51"/>
    <rect x="200" y="70" width="14" height="55" fill="#2a9d8f"/><rect x="220" y="88" width="14" height="37" fill="#264653"/>
  </g>
  <!-- mm ruler -->
  <g>
    <rect x="270" y="50" width="100" height="80" rx="4" fill="#ffffff" opacity="0.06"/>
    <line x1="280" y1="115" x2="360" y2="115" stroke="#f9c74f" stroke-width="1.5"/>
    <text x="320" y="108" fill="#f9c74f" font-family="monospace" font-size="9" text-anchor="middle">88 mm</text>
    <text x="320" y="80" fill="#90be6d" font-family="monospace" font-size="9" text-anchor="middle">PDF+PNG</text>
    <text x="320" y="95" fill="#90be6d" font-family="monospace" font-size="9" text-anchor="middle">300 dpi</text>
  </g>
  <text x="200" y="165" fill="#e9c46a" font-family="monospace" font-size="10" text-anchor="middle">~180 图型 · ggsci 配色 · 字体嵌入 · 出图自检</text>
  <text x="200" y="222" fill="#f8f9fa" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">publication-figures</text>
  <text x="200" y="240" fill="#e9c46a" font-family="Arial" font-size="10" text-anchor="middle">发表级图件标准与选型画廊</text>
</svg>
