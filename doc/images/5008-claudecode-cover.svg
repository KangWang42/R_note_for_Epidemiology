<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c9956c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg)"/>
  
  <!-- Abstract circuit pattern -->
  <g stroke="#e94560" stroke-width="1" opacity="0.15" fill="none">
    <path d="M50 200 L100 200 L120 180 L180 180"/>
    <path d="M350 200 L300 200 L280 180 L220 180"/>
    <circle cx="50" cy="200" r="3"/>
    <circle cx="350" cy="200" r="3"/>
    <circle cx="150" cy="180" r="2"/>
    <circle cx="250" cy="180" r="2"/>
  </g>
  
  <!-- Terminal window -->
  <rect x="40" y="35" width="320" height="170" rx="10" fill="url(#termGrad)" stroke="#d4a574" stroke-width="2"/>
  
  <!-- Terminal title bar -->
  <rect x="40" y="35" width="320" height="28" rx="10" fill="#1a1a2e"/>
  <rect x="40" y="55" width="320" height="8" fill="#1a1a2e"/>
  <circle cx="60" cy="49" r="6" fill="#e94560"/>
  <circle cx="82" cy="49" r="6" fill="#f9c74f"/>
  <circle cx="104" cy="49" r="6" fill="#90be6d"/>
  <text x="200" y="53" fill="#d4a574" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Claude Code</text>
  
  <!-- Terminal content background -->
  <rect x="50" y="70" width="300" height="125" rx="5" fill="#0a0a0a" opacity="0.6"/>
  
  <!-- Command prompt -->
  <text x="60" y="92" fill="#90be6d" font-family="monospace" font-size="10" font-weight="bold">➜</text>
  <text x="75" y="92" fill="#f8f9fa" font-family="monospace" font-size="10">~</text>
  <text x="95" y="92" fill="#d4a574" font-family="monospace" font-size="10">claude</text>
  
  <!-- AI Response box -->
  <rect x="55" y="100" width="290" height="90" rx="4" fill="#1a1a2e" opacity="0.8" stroke="#d4a574" stroke-width="0.5"/>
  
  <!-- Claude avatar/icon -->
  <circle cx="75" cy="118" r="10" fill="url(#claudeGrad)"/>
  <text x="75" y="122" fill="#1a1a2e" font-family="Arial" font-size="8" font-weight="bold" text-anchor="middle">◉</text>
  
  <!-- Response text -->
  <text x="95" y="118" fill="#f8f9fa" font-family="monospace" font-size="9">I'll help you analyze this</text>
  <text x="95" y="132" fill="#f8f9fa" font-family="monospace" font-size="9">dataset. Let me start by</text>
  <text x="95" y="146" fill="#f8f9fa" font-family="monospace" font-size="9">loading and exploring...</text>
  
  <!-- Code snippet in response -->
  <rect x="65" y="155" width="270" height="28" rx="3" fill="#0a0a0a" opacity="0.9"/>
  <text x="72" y="168" fill="#e94560" font-family="monospace" font-size="8">library</text>
  <text x="105" y="168" fill="#f8f9fa" font-family="monospace" font-size="8">(tidyverse)</text>
  <text x="165" y="168" fill="#90be6d" font-family="monospace" font-size="8"># Load data</text>
  <text x="72" y="180" fill="#f9c74f" font-family="monospace" font-size="8">df</text>
  <text x="85" y="180" fill="#f8f9fa" font-family="monospace" font-size="8">&lt;-</text>
  <text x="100" y="180" fill="#e94560" font-family="monospace" font-size="8">read_csv</text>
  <text x="145" y="180" fill="#f8f9fa" font-family="monospace" font-size="8">(</text>
  <text x="150" y="180" fill="#90be6d" font-family="monospace" font-size="8">"data.csv"</text>
  <text x="195" y="180" fill="#f8f9fa" font-family="monospace" font-size="8">)</text>
  
  <!-- Decorative elements -->
  <!-- Skills icons -->
  <g transform="translate(365, 80)">
    <rect x="0" y="0" width="25" height="25" rx="5" fill="#e94560" opacity="0.2"/>
    <text x="12" y="17" fill="#e94560" font-family="monospace" font-size="12" text-anchor="middle">S</text>
  </g>
  <g transform="translate(365, 110)">
    <rect x="0" y="0" width="25" height="25" rx="5" fill="#f9c74f" opacity="0.2"/>
    <text x="12" y="17" fill="#f9c74f" font-family="monospace" font-size="12" text-anchor="middle">A</text>
  </g>
  <g transform="translate(365, 140)">
    <rect x="0" y="0" width="25" height="25" rx="5" fill="#90be6d" opacity="0.2"/>
    <text x="12" y="17" fill="#90be6d" font-family="monospace" font-size="12" text-anchor="middle">M</text>
  </g>
  
  <!-- Floating code symbols -->
  <text x="15" y="80" fill="#e94560" font-family="monospace" font-size="20" opacity="0.2">{ }</text>
  <text x="15" y="180" fill="#f9c74f" font-family="monospace" font-size="16" opacity="0.2">&lt;/&gt;</text>
  <text x="370" y="220" fill="#90be6d" font-family="monospace" font-size="18" opacity="0.2">#</text>
  
  <!-- Connection lines -->
  <line x1="340" y1="92" x2="365" y2="92" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
  
  <!-- Main title -->
  <text x="200" y="235" fill="#f8f9fa" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Claude Code</text>
  <text x="200" y="248" fill="#d4a574" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">AI-Powered Terminal Assistant</text>
</svg>
