<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c9956c;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg)"/>

  <!-- Floating markdown symbols -->
  <text x="20" y="60" fill="#d4a574" font-family="monospace" font-size="20" opacity="0.18"># #</text>
  <text x="350" y="220" fill="#90be6d" font-family="monospace" font-size="22" opacity="0.18">**</text>
  <text x="30" y="210" fill="#e94560" font-family="monospace" font-size="16" opacity="0.18">&gt;</text>

  <!-- Document sheet -->
  <rect x="110" y="30" width="180" height="180" rx="8" fill="url(#paper)" stroke="#d4a574" stroke-width="2"/>

  <!-- File title bar -->
  <rect x="110" y="30" width="180" height="26" rx="8" fill="#16213e"/>
  <rect x="110" y="48" width="180" height="8" fill="#16213e"/>
  <text x="200" y="48" fill="#d4a574" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">CLAUDE.md</text>

  <!-- H1 heading line -->
  <rect x="124" y="68" width="14" height="8" rx="1" fill="#e94560"/>
  <rect x="142" y="68" width="90" height="8" rx="2" fill="#1b263b"/>

  <!-- Rule bullets (red NEVER lines) -->
  <circle cx="128" cy="92" r="3" fill="#e94560"/>
  <rect x="138" y="89" width="120" height="6" rx="2" fill="#adb5bd"/>
  <circle cx="128" cy="108" r="3" fill="#e94560"/>
  <rect x="138" y="105" width="135" height="6" rx="2" fill="#adb5bd"/>
  <circle cx="128" cy="124" r="3" fill="#90be6d"/>
  <rect x="138" y="121" width="105" height="6" rx="2" fill="#adb5bd"/>

  <!-- Sub heading -->
  <rect x="124" y="142" width="12" height="7" rx="1" fill="#f9c74f"/>
  <rect x="142" y="142" width="70" height="7" rx="2" fill="#1b263b"/>

  <!-- table-ish rows -->
  <rect x="124" y="160" width="64" height="6" rx="2" fill="#ced4da"/>
  <rect x="194" y="160" width="78" height="6" rx="2" fill="#ced4da"/>
  <rect x="124" y="174" width="64" height="6" rx="2" fill="#ced4da"/>
  <rect x="194" y="174" width="78" height="6" rx="2" fill="#ced4da"/>
  <rect x="124" y="188" width="64" height="6" rx="2" fill="#ced4da"/>
  <rect x="194" y="188" width="78" height="6" rx="2" fill="#ced4da"/>

  <!-- Claude badge attached -->
  <circle cx="290" cy="40" r="16" fill="url(#claudeGrad)"/>
  <text x="290" y="45" fill="#1a1a2e" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">◉</text>

  <!-- Deletion-test stamp -->
  <g transform="translate(300, 120) rotate(-12)">
    <rect x="0" y="0" width="86" height="26" rx="4" fill="none" stroke="#e94560" stroke-width="2" opacity="0.7"/>
    <text x="43" y="17" fill="#ff8095" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">删除测试</text>
  </g>

  <!-- Title -->
  <text x="200" y="234" fill="#f8f9fa" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">写好一份 CLAUDE.md</text>
  <text x="200" y="248" fill="#d4a574" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">让 AI 长期守规矩的项目规则文件</text>
</svg>
