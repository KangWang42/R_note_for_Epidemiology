    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    smooth-scroll: true
    css: 
      - styles.css
      - custom-sidebar.css
    highlight-style: github
    page-layout: full
    resources:
      - theme-toggle.js
      - custom-sidebar.js
      - custom-sidebar.css
      - home.css
    include-in-header:
      - text: |
          <!-- Favicon -->
          <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
          <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon.svg">
          
          <!-- SEO Meta Tags -->
          <meta name="description" content="R 语言学习笔记 - 涵盖统计分析、数据可视化、机器学习与因果推断的全面教程资源库。从基础到高级，为数据科学家和研究人员提供实用的R语言指南。">
          <meta name="keywords" content="R语言,数据科学,统计分析,数据可视化,机器学习,因果推断,流行病学,生物统计,ggplot2,tidyverse">
          <meta name="author" content="R 语言学习笔记">
          
          <!-- Open Graph / Facebook -->
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://r.wk8686.top/">
          <meta property="og:title" content="R 语言学习笔记 - 数据科学与统计分析完整教程">
          <meta property="og:description" content="涵盖统计分析、数据可视化、机器学习与因果推断的全面 R 语言教程资源库">
          <meta property="og:image" content="https://r.wk8686.top/images/og-image.svg">
          
          <!-- Twitter -->
          <meta property="twitter:card" content="summary_large_image">
          <meta property="twitter:url" content="https://r.wk8686.top/">
          <meta property="twitter:title" content="R 语言学习笔记 - 数据科学与统计分析完整教程">
          <meta property="twitter:description" content="涵盖统计分析、数据可视化、机器学习与因果推断的全面 R 语言教程资源库">
          <meta property="twitter:image" content="https://r.wk8686.top/images/og-image.svg">
          
          <script>
          // 立即应用主题防止闪烁
          (function(){
            var saved = null;
            try {
              saved = localStorage.getItem('r-notes-theme');
            } catch (_) {
              // 存储受限时仍按系统主题完成首帧渲染。
            }
            var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
              document.documentElement.setAttribute('data-theme', 'dark');
              document.documentElement.setAttribute('data-bs-theme', 'dark');
              document.documentElement.classList.add('quarto-dark');
              document.documentElement.classList.remove('quarto-light');
            }
          })();
          </script>
    include-after-body: 
      - include_footer.html
      - custom-sidebar-loader.html
      - text: |
          <script src="/theme-toggle.js" defer></script>

