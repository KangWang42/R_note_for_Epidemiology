<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#ffffff"/>

  <!-- Title -->
  <rect x="0" y="0" width="1400" height="80" fill="url(#headerGrad)"/>
  <text x="700" y="52" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">阶梯设计分析流程</text>

  <!-- Phase Labels -->
  <text x="200" y="120" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">阶段一</text>
  <text x="200" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">数据准备与描述</text>

  <text x="700" y="120" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">阶段二</text>
  <text x="700" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">主要分析</text>

  <text x="1200" y="120" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">阶段三</text>
  <text x="1200" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">敏感性分析</text>

  <!-- Phase 1: Data Preparation -->
  <g transform="translate(50, 170)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="300" height="60" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">1.1 检查数据结构</text>
    <text x="150" y="78" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">cluster × period × individual</text>

    <!-- Arrow -->
    <path d="M 150 90 L 150 110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Box 2 -->
    <rect x="0" y="120" width="300" height="60" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="158" font-family="system-ui, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">1.2 描述性统计</text>
    <text x="150" y="198" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">样本量、基线特征</text>

    <!-- Arrow -->
    <path d="M 150 210 L 150 230" stroke="#94a3b8" stroke-width="2"/>

    <!-- Box 3 -->
    <rect x="0" y="240" width="300" height="60" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="278" font-family="system-ui, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">1.3 可视化设计</text>
    <text x="150" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">阶梯图、趋势图</text>
  </g>

  <!-- Phase 2: Main Analysis -->
  <g transform="translate(550, 170)">
    <!-- Main Analysis Box -->
    <rect x="0" y="0" width="300" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="150" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2.1 混合效应模型</text>
    <text x="150" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">Y ~ intervention + period + (1|cluster)</text>

    <!-- Arrow -->
    <path d="M 150 110 L 150 130" stroke="#94a3b8" stroke-width="2"/>

    <!-- Box 2 -->
    <rect x="0" y="140" width="300" height="60" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="178" font-family="system-ui, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">2.2 调整协变量</text>
    <text x="150" y="218" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">加入序列效应、个体协变量</text>

    <!-- Arrow -->
    <path d="M 150 230 L 150 250" stroke="#94a3b8" stroke-width="2"/>

    <!-- Box 3 -->
    <rect x="0" y="260" width="300" height="60" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="298" font-family="system-ui, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">2.3 替代分析</text>
    <text x="150" y="338" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">GEE (geepack)</text>
  </g>

  <!-- Phase 3: Sensitivity Analysis -->
  <g transform="translate(1050, 170)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="300" height="80" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">3.1 排除极端时期</text>
    <text x="150" y="63" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">排除第1期/最后期</text>

    <!-- Arrow -->
    <path d="M 150 90 L 150 110" stroke="#94a3b8" stroke-width="2"/>

    <!-- Box 2 -->
    <rect x="0" y="120" width="300" height="80" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="158" font-family="system-ui, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">3.2 交互效应检验</text>
    <text x="150" y="183" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">intervention × period</text>

    <!-- Arrow -->
    <path d="M 150 210 L 150 230" stroke="#94a3b8" stroke-width="2"/>

    <!-- Box 3 -->
    <rect x="0" y="240" width="300" height="80" rx="8" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="278" font-family="system-ui, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">3.3 ICC估计</text>
    <text x="150" y="303" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">从空模型计算</text>
  </g>

  <!-- Phase Arrows -->
  <g>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#94a3b8"/>
      </marker>
    </defs>

    <!-- Arrow from Phase 1 to 2 -->
    <path d="M 360 320 L 540 320" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
    <text x="450" y="310" font-family="system-ui, sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">主要分析</text>

    <!-- Arrow from Phase 2 to 3 -->
    <path d="M 860 320 L 1040 320" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
    <text x="950" y="310" font-family="system-ui, sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">验证稳健性</text>
  </g>

  <!-- Key Points Box -->
  <rect x="50" y="580" width="1300" height="180" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="700" y="620" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">核心要点</text>

  <g transform="translate(100, 650)">
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
    <text x="20" y="6" font-family="system-ui, sans-serif" font-size="16" fill="#78350f">必须包含集群随机效应 (1|cluster)</text>

    <circle cx="0" cy="40" r="6" fill="#f59e0b"/>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="16" fill="#78350f">必须包含时期固定效应 factor(period)</text>

    <circle cx="0" cy="80" r="6" fill="#f59e0b"/>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="16" fill="#78350f">主要分析报告混合模型，敏感性分析验证稳健性</text>
  </g>

  <g transform="translate(700, 650)">
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
    <text x="20" y="6" font-family="system-ui, sans-serif" font-size="16" fill="#78350f">注意时间趋势混杂，加入时期效应控制</text>

    <circle cx="0" cy="40" r="6" fill="#f59e0b"/>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="16" fill="#78350f">检验干预×时期交互，评估效应稳定性</text>

    <circle cx="0" cy="80" r="6" fill="#f59e0b"/>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="16" fill="#78350f">报告 ICC 值，说明组内相关程度</text>
  </g>
</svg>
