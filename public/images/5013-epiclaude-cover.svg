<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1b263b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c9956c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a9d8f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#21807a;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg)"/>

  <!-- Faint ECG / epidemiology line -->
  <path d="M0 60 L80 60 L95 60 L102 35 L110 85 L118 60 L150 60 L400 60"
        stroke="#2a9d8f" stroke-width="1.5" fill="none" opacity="0.25"/>

  <!-- Pipeline: numbered research folders -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="60" height="46" rx="6" fill="url(#folderGrad)" opacity="0.85"/>
    <text x="30" y="20" fill="#0d1b2a" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">01_data</text>
    <text x="30" y="36" fill="#0d1b2a" font-family="monospace" font-size="9" text-anchor="middle">rawdata</text>
  </g>
  <g transform="translate(120, 90)">
    <rect x="0" y="0" width="60" height="46" rx="6" fill="url(#folderGrad)" opacity="0.85"/>
    <text x="30" y="20" fill="#0d1b2a" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">02_code</text>
    <text x="30" y="36" fill="#0d1b2a" font-family="monospace" font-size="9" text-anchor="middle">.R</text>
  </g>
  <g transform="translate(200, 90)">
    <rect x="0" y="0" width="60" height="46" rx="6" fill="url(#folderGrad)" opacity="0.85"/>
    <text x="30" y="20" fill="#0d1b2a" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">03/04</text>
    <text x="30" y="36" fill="#0d1b2a" font-family="monospace" font-size="9" text-anchor="middle">表/图</text>
  </g>
  <g transform="translate(280, 90)">
    <rect x="0" y="0" width="60" height="46" rx="6" fill="url(#folderGrad)" opacity="0.85"/>
    <text x="30" y="20" fill="#0d1b2a" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">07_paper</text>
    <text x="30" y="36" fill="#0d1b2a" font-family="monospace" font-size="9" text-anchor="middle">manuscript</text>
  </g>

  <!-- Pipeline arrows -->
  <g stroke="#d4a574" stroke-width="2" opacity="0.6">
    <line x1="102" y1="113" x2="118" y2="113"/>
    <line x1="182" y1="113" x2="198" y2="113"/>
    <line x1="262" y1="113" x2="278" y2="113"/>
  </g>

  <!-- Claude badge -->
  <circle cx="200" cy="40" r="16" fill="url(#claudeGrad)"/>
  <text x="200" y="45" fill="#0d1b2a" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">◉</text>

  <!-- Floating skill chips -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="78" height="18" rx="9" fill="#e94560" opacity="0.18"/>
    <text x="39" y="13" fill="#ff8095" font-family="monospace" font-size="8" text-anchor="middle">r-biostats</text>
  </g>
  <g transform="translate(118, 160)">
    <rect x="0" y="0" width="96" height="18" rx="9" fill="#f9c74f" opacity="0.18"/>
    <text x="48" y="13" fill="#f9d77a" font-family="monospace" font-size="8" text-anchor="middle">academic-pub</text>
  </g>
  <g transform="translate(224, 160)">
    <rect x="0" y="0" width="86" height="18" rx="9" fill="#90be6d" opacity="0.18"/>
    <text x="43" y="13" fill="#aed98a" font-family="monospace" font-size="8" text-anchor="middle">pub-figures</text>
  </g>
  <g transform="translate(320, 160)">
    <rect x="0" y="0" width="58" height="18" rx="9" fill="#4cc9f0" opacity="0.18"/>
    <text x="29" y="13" fill="#7fd9f5" font-family="monospace" font-size="8" text-anchor="middle">audit</text>
  </g>

  <!-- Main title -->
  <text x="200" y="218" fill="#f8f9fa" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">EpiClaude</text>
  <text x="200" y="238" fill="#d4a574" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">流行病学与生物统计的 Claude Code 工作流</text>
</svg>
